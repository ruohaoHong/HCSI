name: Plastic Anchor 10 Benchmark

on:
  push:
    paths:
      - '.github/workflows/plastic-anchor-10-benchmark.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dimensioned candidates
        uses: actions/download-artifact@v5
        with:
          name: plastic-anchor-dimensioned-candidates
          path: source/dimensioned
          run-id: 34432589944
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download PA14
        uses: actions/download-artifact@v5
        with:
          name: plastic-anchor-pa14
          path: source/pa14
          run-id: 34433000799
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download extra
        uses: actions/download-artifact@v5
        with:
          name: plastic-anchor-extra
          path: source/extra
          run-id: 34433449666
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify files exist
        run: |
          ls -lh source/dimensioned/PA01.jpg
          ls -lh source/dimensioned/PA02.jpg
          ls -lh source/extra/PA18.jpg
          ls -lh source/dimensioned/PA03.jpg
          ls -lh source/dimensioned/PA04.jpg
          ls -lh source/dimensioned/PA06.jpg
          ls -lh source/dimensioned/PA07.jpg
          ls -lh source/extra/PA17.jpg
          ls -lh source/pa14/PA14.jpg
          ls -lh source/dimensioned/PA10.jpg
