name: Case E Real Image Stress Test

on:
  push:
    branches:
      - feature/semantic-pixel-ownership
      - feature/edge-observation-primitive
    paths:
      - '.github/workflows/case-e-real-image.yml'
      - 'benchmark/measurement-poc/cases/case-e-m3x30-q80.part*.b64'
      - 'measurement-service/**'
  workflow_dispatch:

jobs:
  case-e:
    runs-on: ubuntu-latest
    env:
      RULERNET_ALLOW_NONCOMMERCIAL_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: measurement-service/requirements.txt
      - run: pip install -r measurement-service/requirements.txt
      - name: Rebuild Case E fixture
        run: |
          cat benchmark/measurement-poc/cases/case-e-m3x30-q80.part*.b64 | base64 --decode > /tmp/case-e.webp
          echo "b408b06f7cc0f70558203e90d8702680269c12fc276cf1fadf4d4f0800e3f385  /tmp/case-e.webp" | sha256sum --check -
      - name: Run complete HCSI measurement path
        run: |
          PYTHONPATH=measurement-service python - <<'PY'
          import json
          from PIL import Image
          import numpy as np
          from app import measure_rgb
          from rulernet import infer_ruler
          from scale_units import infer_visual_scale
          from scale_reference import resolve_scale_reference

          # Normalized WebP derivative of the exact user-provided Case E image.
          # Geometry and dimensions are unchanged (814x594); only storage encoding
          # differs so the fixture can live in the repository as text chunks.
          # Exact uploaded JPEG SHA256:
          # f05a8ab6d3188469a1d16648bb58cc0a7348e57d367266aa836e10b114a202af
          image = np.asarray(Image.open('/tmp/case-e.webp').convert('RGB'))

          ruler_obs = infer_ruler(image)
          visual_obs = infer_visual_scale(image)
          scale_ref = resolve_scale_reference(image, ruler_obs)
          print("CASE_E_RULERNET=" + json.dumps({
              "detected": ruler_obs.detected,
              "mark_count": len(ruler_obs.mark_points_px),
              "mark_points_px": np.asarray(ruler_obs.mark_points_px).round(3).tolist(),
              "median_px_per_cm": ruler_obs.median_px_per_cm,
              "perspective_ratio": ruler_obs.perspective_ratio,
              "direction_xy": ruler_obs.direction_xy,
              "gate_reasons": list(ruler_obs.gate_reasons),
          }))
          print("CASE_E_VISUAL_SCALE=" + json.dumps({
              "system": visual_obs.system,
              "confidence": visual_obs.confidence,
              "px_per_cm": visual_obs.px_per_cm,
              "minor_tick_px": visual_obs.minor_tick_px,
              "reference_interval_cm": visual_obs.reference_interval_cm,
              "reference_point_count": len(visual_obs.reference_points_px),
              "direction_xy": visual_obs.direction_xy,
              "reason_codes": list(visual_obs.reason_codes),
          }))
          print("CASE_E_SCALE_REF=" + json.dumps({
              "system": scale_ref.system,
              "source": scale_ref.source,
              "confidence": scale_ref.confidence,
              "px_per_cm": scale_ref.px_per_cm,
              "reference_point_count": len(scale_ref.reference_points_px),
              "reason_codes": list(scale_ref.reason_codes),
          }))

          steps = [
              {"operation":"axial_distance","inputs":["object_tip","head_underface"],"purpose":"nominal fastener length L"},
              {"operation":"outer_width","inputs":["threaded_shank"],"purpose":"major diameter D"},
              {"operation":"periodicity","inputs":["threaded_shank"],"purpose":"thread pitch P"},
          ]
          semantic = {
              "head_style":"socket_cap",
              "target_region":{
                  "present":True,
                  "confidence":0.99,
                  "x_min":165,
                  "y_min":710,
                  "x_max":850,
                  "y_max":920,
              },
              "reference_region":{
                  "present":True,
                  "confidence":0.99,
                  "x_min":230,
                  "y_min":130,
                  "x_max":1000,
                  "y_max":705,
              },
          }
          # Generic axis-diagnostic evidence. The fixture GT is deliberately
          # NOT passed into any geometry or edge-estimation function.
          from geometry_executor import _select_object_contour
          from thread_geometry import detect_threaded_shank
          from edge_observation import observe_thread_edges, observe_edge_track
          from diameter_axis import estimate_independent_axis
          coarse = _select_object_contour(image, scale_ref.reference_points_px, scale_ref.px_per_cm, semantic)
          profile = detect_threaded_shank(coarse)
          if profile is not None:
              up, lo = observe_thread_edges(image, profile)
              # Compare identical coarse points and normals; D/P/L remain unchanged.
              sample_mask = profile.sample_mask
              sample_s = profile.s_values[sample_mask].astype(np.float64)
              baseline = profile.center[None, :] + profile.axis[None, :] * sample_s[:, None]
              for side_name, old_track, coarse, outward in (
                  ("positive_normal", up, profile.high[sample_mask], profile.normal),
                  ("negative_normal", lo, profile.low[sample_mask], -profile.normal),
              ):
                  coarse_xy = baseline + profile.normal[None, :] * coarse[:, None]
                  new_track = observe_edge_track(image, coarse_xy, outward, s_px=sample_s)
                  paired = old_track.valid & new_track.valid
                  old_xy = np.asarray([obs.position_xy for obs in old_track.observations], dtype=np.float64)
                  new_xy = np.asarray([obs.position_xy for obs in new_track.observations], dtype=np.float64)
                  displacement = np.linalg.norm(old_xy[paired] - new_xy[paired], axis=1)
                  def finite_median(values, valid):
                      part = np.asarray(values)[valid]
                      return float(np.median(part)) if len(part) else None
                  print("CASE_E_EDGE_PARITY=" + json.dumps({
                      "side": side_name,
                      "samples": int(len(sample_s)),
                      "old_valid": int(np.count_nonzero(old_track.valid)),
                      "new_valid": int(np.count_nonzero(new_track.valid)),
                      "valid_disagreements": int(np.count_nonzero(old_track.valid != new_track.valid)),
                      "paired": int(np.count_nonzero(paired)),
                      "median_position_delta_px": float(np.median(displacement)) if len(displacement) else None,
                      "p90_position_delta_px": float(np.percentile(displacement, 90)) if len(displacement) else None,
                      "old_blur_median_px": finite_median(old_track.blur_10_90_px, old_track.valid),
                      "new_blur_median_px": finite_median(new_track.blur_10_90_px, new_track.valid),
                      "old_uncertainty_median_px": finite_median(old_track.uncertainty_px, old_track.valid),
                      "new_uncertainty_median_px": finite_median(new_track.uncertainty_px, new_track.valid),
                      "old_gradient_median": finite_median(old_track.gradient_strength, old_track.valid),
                      "new_gradient_median": finite_median(new_track.gradient_strength, new_track.valid),
                  }))
              mid = profile.center[0] + profile.axis[0] * up.s_px
              paired = up.valid & lo.valid
              good = (
                  paired & (up.contrast >= 28) & (lo.contrast >= 28)
                  & (up.relative_residual <= 0.18) & (lo.relative_residual <= 0.18)
                  & (up.blur_10_90_px <= 9) & (lo.blur_10_90_px <= 9)
                  & (up.uncertainty_px <= 1) & (lo.uncertainty_px <= 1)
              )
              for begin, end in ((210, 280), (280, 340), (340, 385), (385, 500), (500, 640)):
                  region = (mid >= begin) & (mid < end)
                  both = region & paired
                  print("CASE_E_AXIS_REGION=" + json.dumps({
                      "x": [begin,end],
                      "sample_count": int(np.count_nonzero(region)),
                      "paired": int(np.count_nonzero(both)),
                      "good": int(np.count_nonzero(region & good)),
                      "upper_blur": float(np.nanmedian(up.blur_10_90_px[region & up.valid])) if np.any(region & up.valid) else None,
                      "lower_blur": float(np.nanmedian(lo.blur_10_90_px[region & lo.valid])) if np.any(region & lo.valid) else None,
                      "width_p10_p90": np.percentile((up.outward_px+lo.outward_px)[both],[10,90]).tolist() if np.any(both) else None,
                  }))
              axis = estimate_independent_axis(up,lo)
              print("CASE_E_AXIS=" + json.dumps({
                  "source":"bilateral_smooth_raw_edges",
                  "present":axis is not None,
                  "samples":axis.reference_samples if axis is not None else 0,
                  "rms":axis.residual_px if axis is not None else None,
                  "span_s": [axis.span_start_px,axis.span_end_px] if axis is not None else None,
                  "span_x": [
                      float(profile.center[0]+profile.axis[0]*axis.span_start_px),
                      float(profile.center[0]+profile.axis[0]*axis.span_end_px)
                  ] if axis is not None else None,
                  "slope":axis.normal_slope if axis is not None else None,
              }))
          result = measure_rgb(image, "case-e-m3x30-real", steps, semantic)
          print("CASE_E_RESULT_START")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          print("CASE_E_RESULT_END")

          gt = {"L": 30.0, "D": 3.0, "P": 0.5}
          print("CASE_E_GT=" + json.dumps(gt))

          # D is not allowed to silently reuse the contour's known-short
          # ~2.67 mm estimate. Either report a dimension backed by both
          # observed edges, or explicitly refuse it with image-quality evidence.
          diameter = next(
              (step for step in result["geometry_steps"] if step["operation"] == "outer_width"),
              None,
          )
          assert diameter is not None
          print("CASE_E_D_STATUS=" + str(diameter["status"]))
          print("CASE_E_D_DIAGNOSTICS=" + json.dumps(diameter["diagnostics"]))
          if diameter["status"] == "measured":
              assert abs(float(diameter["value_mm"]) - gt["D"]) <= 0.15, diameter
              assert "edge_diameter_uncertainty_mm" in diameter["diagnostics"], diameter
          else:
              assert diameter["status"] == "not_measured", diameter
              assert set(diameter["reason_codes"]) & {
                  "edge_crest_underresolved",
                  "edge_side_support_insufficient",
                  "edge_diameter_uncertain",
                  "independent_axis_unavailable",
                  "one_sided_crest_insufficient",
                  "one_sided_crest_underresolved",
                  "one_sided_diameter_uncertain",
              }, diameter
              assert "edge_upper_valid_samples" in diameter["diagnostics"], diameter
              assert "edge_lower_valid_samples" in diameter["diagnostics"], diameter

          axial = next(
              (
                  step for step in result.get("geometry_steps", [])
                  if step.get("operation") == "axial_distance"
                  and set(step.get("inputs", [])) == {"object_tip", "head_underface"}
              ),
              None,
          )
          if result.get("measurement_status") != "valid":
              raise SystemExit(
                  "Case E failed: measurement_status="
                  + str(result.get("measurement_status"))
                  + " reasons="
                  + json.dumps(result.get("reason_codes", []))
              )
          if axial is None or axial.get("status") != "measured" or axial.get("value_mm") is None:
              raise SystemExit("Case E failed: semantic fastener L was not measured")

          measured_l = float(axial["value_mm"])
          abs_error = abs(measured_l - gt["L"])
          rel_error = abs_error / gt["L"]
          print(f"CASE_E_L_MM={measured_l:.3f}")
          print(f"CASE_E_L_ABS_ERROR_MM={abs_error:.3f}")
          print(f"CASE_E_L_REL_ERROR_PCT={rel_error * 100.0:.3f}")
          if rel_error > 0.05:
              raise SystemExit(
                  f"Case E failed: L error {rel_error * 100.0:.2f}% exceeds 5%"
              )
          PY
