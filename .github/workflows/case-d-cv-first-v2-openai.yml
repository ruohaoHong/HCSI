# Phase 2C final validation: Case D
# Standards source-of-truth final validation: formal candidates are catalogue-backed; legacy nominal is diagnostic only.
name: Frozen Case D CV-first v2 OpenAI blind E2E

# Follow-up diagnostic on an already-seen fixture, NOT a new independent holdout.
# This run validates the current branch after the raw bilateral head-edge primitive.
# Exact frozen image is SHA-checked; GT enters only after inference.
on:
  push:
    branches: [feature/measurement-confidence-gate, feature/standards-solver-v1, feature/standards-source-of-truth, feature/standards-decision-foundation, feature/physical-likelihood-hardening, feature/semantic-evidence-v1, feature/semantic-evidence-anti-leak, feature/candidate-semantic-discrimination]
    paths:
      - '.github/workflows/case-d-cv-first-v2-openai.yml'
      - 'lib/cv-first-identification.ts'
      - 'lib/cv-grounding-basis.ts'
      - 'lib/purchase-spec-completeness.ts'
      - 'lib/provider-runner.ts'
      - 'lib/formal-nominal-projection.ts'
      - 'lib/measurement-uncertainty.ts'
      - 'lib/physical-evidence-likelihood.ts'
      - 'lib/standards-tolerance-model-v1.ts'
      - 'lib/measurement-v2.ts'
      - 'lib/standards-catalogue.ts'
      - 'lib/standards-database-v1.ts'
      - 'lib/standards-shadow-solver.ts'
      - 'lib/semantic-taxonomy-v1.ts'
      - 'lib/semantic-evidence-v1.ts'
      - 'lib/semantic-reason-codes-v1.ts'
      - 'lib/candidate-feature-metadata-v1.ts'
      - 'lib/candidate-feature-compiler.ts'
      - 'lib/semantic-discrimination-plan-v1.ts'
      - 'lib/targeted-semantic-request.ts'
      - 'lib/targeted-semantic-extractor.ts'
      - 'lib/candidate-semantic-discrimination.ts'
      - 'lib/candidate-blind-semantic-request.ts'
      - 'lib/semantic-evidence-validator.ts'
      - 'lib/semantic-extractor.ts'
      - 'measurement-service/geometry_executor.py'
      - 'measurement-service/head_geometry.py'
      - 'measurement-service/app.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  case-d-blind:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HCSI_MEASUREMENT_SERVICE_URL: http://127.0.0.1:8000
      RULERNET_ALLOW_NONCOMMERCIAL_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: measurement-service/requirements.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Fetch and SHA-check exact frozen D without reading GT
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hcsi-case-d case-d-v2-results
          gh run download 36009560609 --repo "${{ github.repository }}" --name real-case-d --dir /tmp/hcsi-case-d
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = "c0c0929f03eb6b3b053b92e0b6fcee12f20e921360d4cfe31bfef44cdc721d10"
          matches = [p for p in Path('/tmp/hcsi-case-d').rglob('*')
                     if p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest() == expected]
          if len(matches) != 1:
              raise SystemExit(f'Frozen Case D SHA verification failed: {len(matches)} exact matches')
          Path('case-d-v2-results/frozen-d.jpg').write_bytes(matches[0].read_bytes())
          print('Frozen D SHA verified; GT is not loaded before inference')
          PY
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install project dependencies and build unchanged application
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY secret unavailable"; exit 1; }
          python -m pip install -r measurement-service/requirements.txt
          pnpm install --frozen-lockfile
          pnpm build

      - name: Start deterministic CV service and Next.js API
        shell: bash
        run: |
          set -euo pipefail
          nohup python -m uvicorn app:app --app-dir measurement-service --host 127.0.0.1 --port 8000 > /tmp/hcsi-cv-v2.log 2>&1 < /dev/null &
          nohup pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/hcsi-next-v2.log 2>&1 < /dev/null &
          python - <<'PY'
          import time
          import urllib.request
          for url in ['http://127.0.0.1:8000/openapi.json','http://127.0.0.1:3000']:
              for _ in range(100):
                  try:
                      with urllib.request.urlopen(url, timeout=3) as r:
                          if r.status == 200:
                              print('Ready:', url)
                              break
                  except Exception:
                      time.sleep(2)
              else:
                  raise SystemExit('Not ready: '+url)
          PY

      - name: Blind CV preflight and one actual OpenAI purchase inference
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, pathlib, urllib.request, urllib.error
          root = pathlib.Path('case-d-v2-results')
          photo = (root/'frozen-d.jpg').read_bytes()
          encoded = base64.b64encode(photo).decode('ascii')
          def post(route, body):
              req = urllib.request.Request('http://127.0.0.1:3000'+route,
                  data=json.dumps(body).encode(), headers={'Content-Type':'application/json'},
                  method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=900) as resp:
                      data, status = resp.read(), resp.status
              except urllib.error.HTTPError as exc:
                  data, status = exc.read(), exc.code
              if status != 200:
                  raise SystemExit(f'{route} returned HTTP {status}: '+data.decode(errors='replace')[:600])
              return json.loads(data)
          preflight = post('/api/measure', {'image': encoded})
          cv = preflight['measurement']
          assert set(cv['dimensions']) == {'D','P','L_underhead','L_overall','B','K','DK'}
          assert cv['image_sha256'] == 'c0c0929f03eb6b3b053b92e0b6fcee12f20e921360d4cfe31bfef44cdc721d10'
          proof = preflight.get('measurement_proof')
          assert isinstance(proof,str) and proof, 'Cannot reuse signed preflight'
          (root/'cv.json').write_text(json.dumps(cv,ensure_ascii=False,indent=2))
          # The LLM receives ONLY frozen photo, the just-executed CV, and public references.
          # No benchmark manifest or ground truth is loaded by this stage.
          output = post('/api/analyze-openai',
                        {'image':encoded,'measurement':cv,'measurement_proof':proof})
          assert output['measurement_source'] == 'signed_preflight_reused'
          assert output['measurement'] == cv, 'Provider modified signed raw CV evidence'
          # Phase 1 standards shadow regression: raw CV parity + valid candidate universe.
          shadow = output['standards_solver_shadow']
          authority = output['standards_authority']
          assert authority['mode'] == 'standards_authority'
          assert authority['contract_version'] == 'hcsi.standards-authority.v1'
          assert authority['decision']['status'] == 'unresolved'
          assert authority['decision']['selected_candidate_id'] is None
          assert authority['decision']['purchase_ready'] is False
          assert output['formal_nominal_projection'] is None
          semantic = output['semantic_evidence']
          matrix = output['candidate_feature_matrix']
          plan = output['semantic_discrimination_plan']
          targeted = output['targeted_semantic_evidence']
          discrimination = output['candidate_semantic_discrimination']
          authority = output['standards_authority']
          assert matrix['schema_version'] == 'hcsi.candidate-feature-compiler.v1'
          assert matrix['candidate_ids'] == [c['candidate_id'] for c in authority['formal_candidates']]
          assert matrix['discriminative_features'] == []
          for profile in matrix['profiles']:
              for constraint in profile['feature_constraints']:
                  assert constraint['relation'] == 'not_specified'
                  assert constraint['support_status'] == 'unavailable'
                  assert constraint['provenance']['source_type'] == 'candidate_metadata_unavailable'
          assert plan['schema_version'] == 'hcsi.semantic-discrimination-plan.v1'
          assert plan['status'] == 'no_semantic_discriminator_available'
          assert plan['discriminators'] == []
          assert targeted == []
          assert discrimination['schema_version'] == 'hcsi.candidate-semantic-discrimination.v1'
          assert discrimination['candidate_ids_before'] == matrix['candidate_ids']
          assert discrimination['candidate_ids_after'] == matrix['candidate_ids']
          assert discrimination['decision']['selected_candidate_id'] is None
          assert discrimination['decision']['purchase_ready'] is False
          assert discrimination['numeric_score'] is None
          assert discrimination['posterior_probability'] is None
          assert authority['decision']['selected_candidate_id'] is None
          assert authority['decision']['purchase_ready'] is False
          assert output['semantic_evidence_error'] is None
          assert semantic['schema_version'] == 'hcsi.semantic-evidence.v1'
          assert semantic['taxonomy_version'] == 'hcsi.semantic-taxonomy.v1'
          assert semantic['reason_code_taxonomy_version'] == 'hcsi.semantic-reason-codes.v1'
          allowed_observation_reasons = {
              'FEATURE_VISIBLE','FEATURE_PARTIALLY_VISIBLE','FEATURE_NOT_VISIBLE','FEATURE_NOT_OBSERVED',
              'IMAGE_ANGLE_LIMITED','OCCLUDED','GLARE','LOW_CONTRAST','MORPHOLOGY_AMBIGUOUS',
              'OPEN_SET_MORPHOLOGY','HEAD_PROFILE_VISIBLE','HEAD_TOP_NOT_VISIBLE',
              'DRIVE_FACE_NOT_VISIBLE','EXTERNAL_DRIVE_SURFACES_VISIBLE','UNDERHEAD_REGION_VISIBLE',
              'TIP_VISIBLE','THREADS_VISIBLE','THREAD_START_OR_END_NOT_VISIBLE',
              'MARKING_SURFACE_NOT_VISIBLE','MARKING_NOT_OBSERVED','OCR_TEXT_DETECTED',
              'OCR_UNREADABLE','OCR_PARTIAL','BACKGROUND_TEXT_EXCLUDED',
              'FORBIDDEN_CLAIM_REMOVED','UNCALIBRATED_PROBABILITY_REMOVED',
          }
          allowed_quality_reasons = {
              'TARGET_CLEAR','TARGET_PARTIALLY_VISIBLE','SIDE_PROFILE_VISIBLE','HEAD_TOP_NOT_VISIBLE',
              'TIP_AND_THREADS_VISIBLE','DRIVE_DETAIL_LIMITED','IMAGE_LIMITED',
              'TARGET_PARTIALLY_OCCLUDED','LOW_CONTRAST','GLARE','INSUFFICIENT_SEMANTIC_VISIBILITY',
          }
          assert all(set(item['reason_codes']) <= allowed_observation_reasons
                     for item in semantic['observations'])
          assert set(semantic['quality']['reason_codes']) <= allowed_quality_reasons
          forbidden_non_ocr = [
              'metric','imperial','unified','unc','unf','unef','iso','asme',
              'candidate','winner','rank','best match',
          ]
          forbidden_ocr_inference = [
              'probably','likely','looks like','appears to be','seems to be',
              'candidate','winner','best match','rank ',
          ]
          for item in semantic['observations']:
              if item['feature_id'] == 'markings.ocr':
                  raw_text = item.get('raw_text')
                  if raw_text:
                      lowered = raw_text.lower()
                      assert not any(token in lowered for token in forbidden_ocr_inference)
              else:
                  freeform = (item.get('freeform_description') or '').lower()
                  assert not any(token in freeform for token in forbidden_non_ocr)
          assert semantic['extractor_version'] == 'hcsi.candidate-blind-vlm.v1'
          scope = semantic['observation_scope']
          assert scope['physical_measurements_included'] is False
          assert scope['standards_candidates_included'] is False
          assert scope['legacy_nominal_included'] is False
          assert scope['ground_truth_included'] is False
          assert len(semantic['observations']) >= 9
          assert semantic['evidence_sources'] and semantic['independence_groups']
          assert all(item['calibrated_probability'] is None
                     for item in semantic['observations']
                     if item['calibration_status'] == 'uncalibrated')
          uncertainty = authority['measurement_v2']['uncertainty']
          assert uncertainty['schema_version'] == 'hcsi.measurement-uncertainty.v1'
          assert uncertainty['covariance']['null_semantics'] == 'not_estimated'
          assert isinstance(uncertainty['systematic_bias_ledger'], list)
          assert any(item['type'] == 'depth_parallax' for item in uncertainty['systematic_bias_ledger'])
          assert all(item.get('physical_evidence',{}).get('semantics') == 'random_measurement_nominal_proximity_not_standards_likelihood_or_posterior' for item in authority['formal_candidates'])
          assert all(item.get('physical_evidence',{}).get('tolerance',{}).get('status') in ['available','unavailable'] for item in authority['formal_candidates'])
          for item in authority['formal_candidates']:
              pe = item['physical_evidence']
              assert pe['standards_likelihood']['available'] is False
              if pe['joint']['status'] == 'available':
                  assert pe['bias_readiness']['status'] == 'ready'
                  assert pe['covariance_readiness']['status'] == 'complete'
                  assert isinstance(pe['joint']['log_density'], (int,float))
              else:
                  assert pe['joint']['log_density'] is None
          assert output['user_guidance']['purchase_ready'] is False
          assert output['user_guidance']['formal_nominal_source'] == 'versioned_standards_solver'
          assert output['user_guidance']['selected_candidate_id'] is None
          formal_designations = [item['designation'] for item in authority['formal_candidates']]
          assert "#8-32 UNC" in formal_designations
          assert any(item['standard_system'] == 'iso_metric' for item in authority['formal_candidates'])
          assert any(item['standard_system'] == 'unified_inch' for item in authority['formal_candidates'])
          assert authority['legacy_diagnostics']['llm_nominal']['authority'] == 'non_authoritative'
          assert authority['legacy_diagnostics']['dimension_candidate']['authority'] == 'non_authoritative'
          assert shadow['mode'] == 'shadow'
          assert shadow['purchase_ready'] is False
          assert shadow['candidate_summary']['iso_metric'] > 0
          assert shadow['candidate_summary']['unified_inch'] > 0
          obs = {item['quantity']: item['value_mm'] for item in shadow['measurement_v2']['observations']}
          for key in ('D','P','L_underhead'):
              if cv['dimensions'][key]['status'] == 'measured':
                  assert abs(obs[key] - cv['dimensions'][key]['value_mm']) < 1e-9
          designations = [item['designation'] for item in shadow['new_candidates']]
          assert '#8-32 UNC' in designations
          assert shadow['scoring_state']['covariance_available'] == (uncertainty['covariance']['status'] != 'not_estimated')
          (root/'response.json').write_text(json.dumps(output,ensure_ascii=False,indent=2))
          result = output['result']
          assert 'internal_nominal_mapping' not in result, 'Internal verification payload leaked into user-facing result'
          print('CV grounding basis:', output['specification_evidence']['cv_grounding_basis'])
          print('Frozen D API completed; CV status:',cv['measurement_status'])
          print('Purchase gate:', output['specification_evidence']['purchase_gate'])
          print('Optional drive evidence:', output['specification_evidence']['drive_evidence'])
          print('PHASE2B_SEMANTIC_EVIDENCE:', json.dumps(semantic, ensure_ascii=False, sort_keys=True))
          print('OpenAI semantic candidate before gates:',
                output['specification_evidence']['llm_semantic_candidate_before_gates'])
          print('Independent CV dimension candidate:',
                output['specification_evidence']['dimension_candidate'])
          print('OpenAI inferred head:', result['fastener_interpretation']['head_style'])
          print('OpenAI nominal inference:',result['fastener_interpretation']['nominal_specification'])
          print('User guidance:',output['user_guidance'])
          PY

      - name: Evaluate exact D ground truth only after freezing inference
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('case-d-v2-results')
          cv=json.loads((root/'cv.json').read_text())
          result=json.loads((root/'response.json').read_text())
          gt={'D':4.1656,'P':0.79375,'L_underhead':10.31875}
          comparisons={}
          for key, expected in gt.items():
              observed=cv['dimensions'][key]
              measured=observed['value_mm'] if observed['status']=='measured' else None
              comparisons[key]={
                  'measured_mm':measured,'gt_mm':expected,
                  'absolute_error_mm':abs(measured-expected) if measured is not None else None,
                  'relative_error_pct':100*abs(measured-expected)/expected if measured is not None else None,
              }
          head=result['result']['fastener_interpretation']['head_style']
          purchase_ready=result['user_guidance']['purchase_ready']
          nominal=result['result']['fastener_interpretation']['nominal_specification']
          cv_measurement_pass=all(
              cv['dimensions'][key]['status']=='measured'
              for key in ('D','P','L_underhead','K','DK')
          )
          # The public nominal may legitimately add the independently identified
          # head style and an explicit drive caveat. Score the two required
          # dimension tokens instead of requiring the whole sentence to equal a
          # dimension-only string.
          nominal_dimensions_match='#8-32' in nominal and '13/32 in' in nominal
          report={'case':'D','gt_evaluation_after_inference':True,
                  'gt_head_style':'pan','output_head_style':head,'head_matches_gt':head=='pan',
                  'workflow_execution_pass':True,
                  'cv_measurement_pass':cv_measurement_pass,
                  'llm_head_identification_pass':head=='pan',
                  'complete_purchase_specification_pass':purchase_ready and head=='pan' and nominal_dimensions_match,
                  'purchase_ready':purchase_ready,
                  'nominal_output':nominal,
                  'nominal_dimensions_match':nominal_dimensions_match,
                  'dimension_candidate':result['specification_evidence'].get('dimension_candidate'),
                  'cv_errors':comparisons,
                  'single_llm_cv_grounded':True,
                  'internal_mapping_absent_from_public_result':'internal_nominal_mapping' not in result['result'],
                  'optional_B_not_a_pass_criterion':True}
          (root/'evaluation.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Upload raw inference and post-inference evaluation (not original photo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cv-first-v2-blind-d-openai
          path: |
            case-d-v2-results/cv.json
            case-d-v2-results/response.json
            case-d-v2-results/evaluation.json
          if-no-files-found: ignore

      - name: Print sanitized application logs when unsuccessful
        if: failure()
        shell: bash
        run: |
          echo 'CV service diagnostics:'
          tail -n 55 /tmp/hcsi-cv-v2.log 2>/dev/null || true
          echo 'Next.js service diagnostics:'
          tail -n 55 /tmp/hcsi-next-v2.log 2>/dev/null || true
