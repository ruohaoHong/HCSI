name: Confidence Gate Real Regression

on:
  push:
    branches:
      - feature/measurement-confidence-gate

permissions:
  actions: read
  contents: read

jobs:
  fixed-real-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RULERNET_ALLOW_NONCOMMERCIAL_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: measurement-service/requirements.txt
      - run: pip install -r measurement-service/requirements.txt
      - name: Download immutable A-D artifact from baseline run
        uses: actions/download-artifact@v4
        with:
          name: fixed-cases-abcd-64f8f405
          path: /tmp/fixed-cases
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36178417605
      - name: Rebuild immutable Case E repository derivative
        run: |
          cat benchmark/measurement-poc/cases/case-e-m3x30-q80.part*.b64 | base64 --decode > /tmp/fixed-cases/case-e.webp
          echo "b408b06f7cc0f70558203e90d8702680269c12fc276cf1fadf4d4f0800e3f385  /tmp/fixed-cases/case-e.webp" | sha256sum --check -
      - name: Run baseline and confidence-gate code on identical bytes
        run: |
          git worktree add --detach /tmp/hcsi-baseline 64f8f405ff01053b2d0c8a29e8376119e9032dba
          python benchmark/measurement-poc/run_fixed_confidence_cases.py \
            --service-dir /tmp/hcsi-baseline/measurement-service \
            --fixture-dir /tmp/fixed-cases \
            --output /tmp/baseline.json \
            --label 64f8f405-baseline
          python benchmark/measurement-poc/run_fixed_confidence_cases.py \
            --service-dir measurement-service \
            --fixture-dir /tmp/fixed-cases \
            --output /tmp/current.json \
            --label confidence-gate
      - name: Compare values and publish evidence summary
        run: |
          python - <<'PY'
          import json, os, pathlib

          baseline = json.loads(pathlib.Path('/tmp/baseline.json').read_text())
          current = json.loads(pathlib.Path('/tmp/current.json').read_text())
          base_by_id = {row['case']: row for row in baseline['cases']}
          current_by_id = {row['case']: row for row in current['cases']}
          rows = []
          for case_id in ('A', 'B', 'D', 'E'):
              before = base_by_id[case_id]
              after = current_by_id[case_id]
              deltas = {}
              for key in ('D_mm', 'P_mm', 'L_mm'):
                  left = before['values_mm'][key]
                  right = after['values_mm'][key]
                  deltas[key] = None if left is None or right is None else float(right) - float(left)
              rows.append({
                  'case': case_id,
                  'fixture_sha256': after['fixture_sha256'],
                  'baseline_values_mm': before['values_mm'],
                  'current_values_mm': after['values_mm'],
                  'delta_mm': deltas,
                  'measurement_status': after['measurement_status'],
                  'measurement_confidence': after['measurement_confidence'],
                  'confidence_reason_codes': after['confidence_reason_codes'],
                  'same_plane_status': after['same_plane_status'],
              })
          for row in rows:
              if row['case'] in {'B', 'D', 'E'}:
                  assert all(value == 0.0 for value in row['delta_mm'].values()), row

          payload = {'baseline': baseline['label'], 'current': current['label'], 'cases': rows}
          pathlib.Path('/tmp/confidence-gate-regression.json').write_text(
              json.dumps(payload, indent=2), encoding='utf-8'
          )
          summary = pathlib.Path(os.environ['GITHUB_STEP_SUMMARY'])
          lines = [
              '# Confidence Gate fixed real-case regression', '',
              '| Case | D mm | P mm | L mm | delta D/P/L mm | confidence | same plane |',
              '|---|---:|---:|---:|---|---|---|',
          ]
          for row in rows:
              values = row['current_values_mm']
              delta = row['delta_mm']
              lines.append(
                  f"| {row['case']} | {values['D_mm']} | {values['P_mm']} | {values['L_mm']} | "
                  f"{delta['D_mm']} / {delta['P_mm']} / {delta['L_mm']} | "
                  f"{row['measurement_confidence']} | {row['same_plane_status']} |"
              )
          lines.extend(['', '```json', json.dumps(payload, indent=2), '```'])
          summary.write_text('\n'.join(lines), encoding='utf-8')
          print(json.dumps(payload, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: confidence-gate-real-regression
          path: /tmp/confidence-gate-regression.json
