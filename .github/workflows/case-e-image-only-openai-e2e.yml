# Phase 2E acceptance: no real corpus/artifact/policy means exact resolver stays fail-closed; no fusion/decision side effects.
# Phase 2D final validation after contract hardening; production logic unchanged.
# Phase 2D acceptance: empty production calibration registry must fail closed; no fusion/decision side effects.
# Phase 2C final validation: same-HEAD acceptance trigger; no production logic change.
# Standards source-of-truth final validation: formal candidates are catalogue-backed; legacy nominal is diagnostic only.
# Head-evidence packet experiment: D/P + K/DK + coarse geometry are primary head-naming evidence; no head-style lookup guidance.
# Phase 1 shadow-mode branch regression enabled.\nname: Case E image-only OpenAI E2E

# Validation harness only. Final regression run for the raw bilateral
# head-edge primitive plus generic raw/contour evidence arbitration. No GT or
# expected semantics enter either inference stage; GT loads only afterwards.
on:
  push:
    branches: [feature/measurement-confidence-gate, feature/standards-solver-v1, feature/standards-source-of-truth, feature/standards-decision-foundation, feature/physical-likelihood-hardening, feature/semantic-evidence-v1, feature/semantic-evidence-anti-leak, feature/candidate-semantic-discrimination, feature/semantic-calibration-foundation, feature/semantic-calibration-corpus-admission, feature/semantic-calibration-lineage-hardening, feature/calibration-data-binding-geometry-closure]
    paths:
      - '.github/workflows/case-e-image-only-openai-e2e.yml'
      - 'lib/provider-runner.ts'
      - 'lib/formal-nominal-projection.ts'
      - 'lib/measurement-uncertainty.ts'
      - 'lib/physical-evidence-likelihood.ts'
      - 'lib/standards-tolerance-model-v1.ts'
      - 'lib/purchase-spec-completeness.ts'
      - 'lib/cv-grounding-basis.ts'
      - 'lib/cv-first-identification.ts'
      - 'lib/identification.ts'
      - 'lib/measurement-v2.ts'
      - 'lib/standards-catalogue.ts'
      - 'lib/standards-database-v1.ts'
      - 'lib/standards-shadow-solver.ts'
      - 'lib/semantic-taxonomy-v1.ts'
      - 'lib/semantic-evidence-v1.ts'
      - 'lib/semantic-reason-codes-v1.ts'
      - 'lib/candidate-feature-metadata-v1.ts'
      - 'lib/candidate-feature-compiler.ts'
      - 'lib/semantic-discrimination-plan-v1.ts'
      - 'lib/targeted-semantic-request.ts'
      - 'lib/targeted-semantic-extractor.ts'
      - 'lib/candidate-semantic-discrimination.ts'
      - 'lib/semantic-calibration-policy-v1.ts'
      - 'lib/semantic-calibration-registry.ts'
      - 'lib/semantic-calibration-resolver.ts'
      - 'lib/semantic-calibration-corpus-ingest.ts'
      - 'lib/semantic-sensor-observation-record-v1.ts'
      - 'lib/semantic-confusion-model-v1.ts'
      - 'lib/semantic-calibration-fit.ts'
      - 'lib/semantic-calibration-validation.ts'
      - 'lib/semantic-calibration-admission.ts'
      - 'lib/semantic-calibration-lineage-v1.ts'
      - 'lib/semantic-calibration-digest.ts'
      - 'lib/semantic-observation-pixel-geometry.ts'
      - 'lib/semantic-image-dimensions.ts'
      - 'lib/semantic-calibration-phase2e1.test.ts'
      - 'lib/semantic-calibration-phase2e1-1.test.ts'
      - 'lib/semantic-runtime-quality.ts'
      - 'lib/semantic-calibration-assessment.ts'
      - 'lib/candidate-blind-semantic-request.ts'
      - 'lib/semantic-evidence-validator.ts'
      - 'lib/semantic-extractor.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  case-e-image-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HCSI_MEASUREMENT_SERVICE_URL: http://127.0.0.1:8000
      RULERNET_ALLOW_NONCOMMERCIAL_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: measurement-service/requirements.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Reassemble and verify immutable Case E photograph derivative
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p case-e-e2e-results
          python benchmark/measurement-poc/assemble_case_e_fixture.py \
            --output case-e-e2e-results/case-e.webp
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          path = Path('case-e-e2e-results/case-e.webp')
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = 'b408b06f7cc0f70558203e90d8702680269c12fc276cf1fadf4d4f0800e3f385'
          if actual != expected:
              raise SystemExit(f'Case E derivative SHA mismatch: {actual} != {expected}')
          metadata = {
              'fixture_used': 'repository-safe WebP Q80 derivative of frozen user photograph',
              'fixture_sha256': actual,
              'original_uploaded_jpeg_sha256': 'f05a8ab6d3188469a1d16648bb58cc0a7348e57d367266aa836e10b114a202af',
              'dimensions_preserved': True,
              'inference_ground_truth_supplied': False,
          }
          Path('case-e-e2e-results/fixture.json').write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2))
          print('Case E derivative SHA-256 VERIFIED:', actual)
          print('No GT, expected head style, or expected specification has been loaded into inference.')
          PY

      - name: Install dependencies and build application
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY unavailable"; exit 1; }
          python -m pip install -r measurement-service/requirements.txt
          pnpm install --frozen-lockfile
          pnpm build

      - name: Start deterministic CV service and Next.js API
        shell: bash
        run: |
          set -euo pipefail
          nohup python -m uvicorn app:app --app-dir measurement-service --host 127.0.0.1 --port 8000 > /tmp/hcsi-e-cv.log 2>&1 < /dev/null &
          nohup pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/hcsi-e-next.log 2>&1 < /dev/null &
          python - <<'PY'
          import time, urllib.request
          for url in ['http://127.0.0.1:8000/openapi.json', 'http://127.0.0.1:3000']:
              for _ in range(100):
                  try:
                      with urllib.request.urlopen(url, timeout=3) as response:
                          if response.status == 200:
                              print('Ready:', url)
                              break
                  except Exception:
                      time.sleep(2)
              else:
                  raise SystemExit('Service did not start: ' + url)
          PY

      - name: Image-only request through full backend E2E
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, pathlib, urllib.error, urllib.request
          root = pathlib.Path('case-e-e2e-results')
          image = (root / 'case-e.webp').read_bytes()
          encoded = base64.b64encode(image).decode('ascii')

          def post(route, body):
              request = urllib.request.Request(
                  'http://127.0.0.1:3000' + route,
                  data=json.dumps(body).encode('utf-8'),
                  headers={'Content-Type': 'application/json'},
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(request, timeout=900) as response:
                      status, raw = response.status, response.read()
              except urllib.error.HTTPError as error:
                  status, raw = error.code, error.read()
              payload = json.loads(raw)
              if status != 200:
                  (root / 'inference-error.json').write_text(
                      json.dumps({'route': route, 'status': status, 'payload': payload},
                                 ensure_ascii=False, indent=2))
                  raise SystemExit(f'{route} HTTP {status}: ' + raw.decode(errors='replace')[:1200])
              return payload

          # Stage 1 receives the photograph only and performs real OpenAI
          # localization before deterministic CV. No semantic ROI is injected.
          preflight = post('/api/measure', {'image': encoded})
          cv = preflight['measurement']
          proof = preflight.get('measurement_proof')
          localization = preflight.get('semantic_localization')
          assert isinstance(proof, str) and proof
          assert localization and localization['semantic_vision']['target_region']['present']
          assert cv['object'].get('semantic_routing_supplied') is True
          assert cv['image_sha256'] == 'b408b06f7cc0f70558203e90d8702680269c12fc276cf1fadf4d4f0800e3f385'
          assert set(cv['dimensions']) == {'D','P','L_underhead','L_overall','B','K','DK'}
          (root / 'preflight.json').write_text(json.dumps(preflight, ensure_ascii=False, indent=2))

          # Stage 2 receives the same photograph plus signed CV evidence.
          output = post('/api/analyze-openai', {
              'image': encoded,
              'measurement': cv,
              'measurement_proof': proof,
          })
          (root / 'response.json').write_text(json.dumps(output, ensure_ascii=False, indent=2))
          (root / 'cv.json').write_text(json.dumps(cv, ensure_ascii=False, indent=2))
          assert output['measurement_source'] == 'signed_preflight_reused'
          assert output.get('semantic_roi_source') == 'signed_preflight'
          assert output['measurement'] == cv
          # Phase 1 standards shadow regression: raw CV parity + valid candidate universe.
          shadow = output['standards_solver_shadow']
          authority = output['standards_authority']
          assert authority['mode'] == 'standards_authority'
          assert authority['contract_version'] == 'hcsi.standards-authority.v1'
          assert authority['decision']['status'] == 'unresolved'
          assert authority['decision']['selected_candidate_id'] is None
          assert authority['decision']['purchase_ready'] is False
          assert output['formal_nominal_projection'] is None
          semantic = output['semantic_evidence']
          matrix = output['candidate_feature_matrix']
          plan = output['semantic_discrimination_plan']
          targeted = output['targeted_semantic_evidence']
          discrimination = output['candidate_semantic_discrimination']
          calibration = output['semantic_calibration_assessment']
          semantic_likelihood = output['semantic_likelihood_evidence']
          resolution = output['semantic_calibration_resolution']
          registry_status = output['semantic_calibration_registry_status']
          runtime_quality = output['semantic_runtime_quality']
          admission_status = output['semantic_calibration_admission_status']
          assert registry_status['admitted_dataset_count'] == 0
          assert registry_status['admitted_artifact_count'] == 0
          assert registry_status['active_registry_entries'] == 0
          assert registry_status['active_policy_id'] is None
          assert registry_status['active_policy_version'] is None
          assert resolution
          assert all(item['calibration_artifact_id'] is None for item in resolution)
          assert all(item['status'] != 'resolved' for item in resolution)
          assert all('no_applicable_validated_calibration_artifact' in item['reason_codes'] for item in resolution)
          assert runtime_quality
          assert all(item['quality']['width_px'] is not None and item['quality']['width_px'] > 0 for item in runtime_quality)
          assert all(item['quality']['height_px'] is not None and item['quality']['height_px'] > 0 for item in runtime_quality)
          assert all(item['quality']['viewpoint'] == 'unknown' for item in runtime_quality)
          assert all(item['quality']['capture_type'] == 'single_image' for item in runtime_quality)
          assert admission_status['automatic_runtime_admission'] is False
          assert admission_status['eligible_for_runtime_admission'] is False
          assert calibration['schema_version'] == 'hcsi.semantic-calibration-assessment.v1'
          assert calibration['available'] is False
          assert calibration['items']
          assert all(item['calibration_artifact_id'] is None for item in calibration['items'])
          assert all(item['calibration_status'] == 'unavailable' for item in calibration['items'])
          assert all(item['likelihood_eligible'] is False for item in calibration['items'])
          assert all(item['calibrated_probability'] is None for item in calibration['items'])
          assert all('no_applicable_validated_calibration_artifact' in item['reason_codes'] for item in calibration['items'])
          assert semantic_likelihood['schema_version'] == 'hcsi.semantic-likelihood-evidence.v1'
          assert semantic_likelihood['available'] is False
          assert semantic_likelihood['candidate_likelihood_not_implemented'] is True
          assert all(item['log_likelihood'] is None for item in semantic_likelihood['items'])
          assert all(item['calibrated_log_likelihood_ratio'] is None for item in semantic_likelihood['items'])
          assert all(item['status'] == 'calibration_unavailable' for item in semantic_likelihood['items'])
          authority = output['standards_authority']
          assert matrix['schema_version'] == 'hcsi.candidate-feature-compiler.v1'
          assert matrix['candidate_ids'] == [c['candidate_id'] for c in authority['formal_candidates']]
          assert matrix['discriminative_features'] == []
          for profile in matrix['profiles']:
              for constraint in profile['feature_constraints']:
                  assert constraint['relation'] == 'not_specified'
                  assert constraint['support_status'] == 'unavailable'
                  assert constraint['provenance']['source_type'] == 'candidate_metadata_unavailable'
          assert plan['schema_version'] == 'hcsi.semantic-discrimination-plan.v1'
          assert plan['status'] == 'no_semantic_discriminator_available'
          assert plan['discriminators'] == []
          assert targeted == []
          assert discrimination['schema_version'] == 'hcsi.candidate-semantic-discrimination.v1'
          assert discrimination['candidate_ids_before'] == matrix['candidate_ids']
          assert discrimination['candidate_ids_after'] == matrix['candidate_ids']
          assert discrimination['decision']['selected_candidate_id'] is None
          assert discrimination['decision']['purchase_ready'] is False
          assert discrimination['numeric_score'] is None
          assert discrimination['posterior_probability'] is None
          assert authority['decision']['selected_candidate_id'] is None
          assert authority['decision']['purchase_ready'] is False
          assert output['semantic_evidence_error'] is None
          assert semantic['schema_version'] == 'hcsi.semantic-evidence.v1'
          assert semantic['taxonomy_version'] == 'hcsi.semantic-taxonomy.v1'
          assert semantic['reason_code_taxonomy_version'] == 'hcsi.semantic-reason-codes.v1'
          allowed_observation_reasons = {
              'FEATURE_VISIBLE','FEATURE_PARTIALLY_VISIBLE','FEATURE_NOT_VISIBLE','FEATURE_NOT_OBSERVED',
              'IMAGE_ANGLE_LIMITED','OCCLUDED','GLARE','LOW_CONTRAST','MORPHOLOGY_AMBIGUOUS',
              'OPEN_SET_MORPHOLOGY','HEAD_PROFILE_VISIBLE','HEAD_TOP_NOT_VISIBLE',
              'DRIVE_FACE_NOT_VISIBLE','EXTERNAL_DRIVE_SURFACES_VISIBLE','UNDERHEAD_REGION_VISIBLE',
              'TIP_VISIBLE','THREADS_VISIBLE','THREAD_START_OR_END_NOT_VISIBLE',
              'MARKING_SURFACE_NOT_VISIBLE','MARKING_NOT_OBSERVED','OCR_TEXT_DETECTED',
              'OCR_UNREADABLE','OCR_PARTIAL','BACKGROUND_TEXT_EXCLUDED',
              'FORBIDDEN_CLAIM_REMOVED','UNCALIBRATED_PROBABILITY_REMOVED',
          }
          allowed_quality_reasons = {
              'TARGET_CLEAR','TARGET_PARTIALLY_VISIBLE','SIDE_PROFILE_VISIBLE','HEAD_TOP_NOT_VISIBLE',
              'TIP_AND_THREADS_VISIBLE','DRIVE_DETAIL_LIMITED','IMAGE_LIMITED',
              'TARGET_PARTIALLY_OCCLUDED','LOW_CONTRAST','GLARE','INSUFFICIENT_SEMANTIC_VISIBILITY',
          }
          assert all(set(item['reason_codes']) <= allowed_observation_reasons
                     for item in semantic['observations'])
          assert set(semantic['quality']['reason_codes']) <= allowed_quality_reasons
          forbidden_non_ocr = [
              'metric','imperial','unified','unc','unf','unef','iso','asme',
              'candidate','winner','rank','best match',
          ]
          forbidden_ocr_inference = [
              'probably','likely','looks like','appears to be','seems to be',
              'candidate','winner','best match','rank ',
          ]
          for item in semantic['observations']:
              if item['feature_id'] == 'markings.ocr':
                  raw_text = item.get('raw_text')
                  if raw_text:
                      lowered = raw_text.lower()
                      assert not any(token in lowered for token in forbidden_ocr_inference)
              else:
                  freeform = (item.get('freeform_description') or '').lower()
                  assert not any(token in freeform for token in forbidden_non_ocr)
          assert semantic['extractor_version'] == 'hcsi.candidate-blind-vlm.v1'
          scope = semantic['observation_scope']
          assert scope['physical_measurements_included'] is False
          assert scope['standards_candidates_included'] is False
          assert scope['legacy_nominal_included'] is False
          assert scope['ground_truth_included'] is False
          assert len(semantic['observations']) >= 9
          assert semantic['evidence_sources'] and semantic['independence_groups']
          assert all(item['calibrated_probability'] is None
                     for item in semantic['observations']
                     if item['calibration_status'] == 'uncalibrated')
          uncertainty = authority['measurement_v2']['uncertainty']
          assert uncertainty['schema_version'] == 'hcsi.measurement-uncertainty.v1'
          assert uncertainty['covariance']['null_semantics'] == 'not_estimated'
          assert isinstance(uncertainty['systematic_bias_ledger'], list)
          assert any(item['type'] == 'depth_parallax' for item in uncertainty['systematic_bias_ledger'])
          assert all(item.get('physical_evidence',{}).get('semantics') == 'random_measurement_nominal_proximity_not_standards_likelihood_or_posterior' for item in authority['formal_candidates'])
          assert all(item.get('physical_evidence',{}).get('tolerance',{}).get('status') in ['available','unavailable'] for item in authority['formal_candidates'])
          for item in authority['formal_candidates']:
              pe = item['physical_evidence']
              assert pe['standards_likelihood']['available'] is False
              if pe['joint']['status'] == 'available':
                  assert pe['bias_readiness']['status'] == 'ready'
                  assert pe['covariance_readiness']['status'] == 'complete'
                  assert isinstance(pe['joint']['log_density'], (int,float))
              else:
                  assert pe['joint']['log_density'] is None
          assert output['user_guidance']['purchase_ready'] is False
          assert output['user_guidance']['formal_nominal_source'] == 'versioned_standards_solver'
          assert output['user_guidance']['selected_candidate_id'] is None
          formal_designations = [item['designation'] for item in authority['formal_candidates']]
          assert "M3 × 0.5" in formal_designations
          assert any(item['standard_system'] == 'iso_metric' for item in authority['formal_candidates'])
          assert any(item['standard_system'] == 'unified_inch' for item in authority['formal_candidates'])
          assert authority['legacy_diagnostics']['llm_nominal']['authority'] == 'non_authoritative'
          assert authority['legacy_diagnostics']['dimension_candidate']['authority'] == 'non_authoritative'
          assert shadow['mode'] == 'shadow'
          assert shadow['purchase_ready'] is False
          assert shadow['candidate_summary']['iso_metric'] > 0
          assert shadow['candidate_summary']['unified_inch'] > 0
          obs = {item['quantity']: item['value_mm'] for item in shadow['measurement_v2']['observations']}
          for key in ('D','P','L_underhead'):
              if cv['dimensions'][key]['status'] == 'measured':
                  assert abs(obs[key] - cv['dimensions'][key]['value_mm']) < 1e-9
          designations = [item['designation'] for item in shadow['new_candidates']]
          assert 'M3 × 0.5' in designations
          assert shadow['scoring_state']['covariance_available'] == (uncertainty['covariance']['status'] != 'not_estimated')


          interp = output['result']['fastener_interpretation']
          evidence = output['specification_evidence']
          print('CASE E FULL E2E COMPLETED')
          print('preflight localization:', json.dumps(localization, ensure_ascii=False))
          print('CV status:', cv['measurement_status'])
          print('CV confidence:', cv['measurement_confidence'])
          for key, dimension in cv['dimensions'].items():
              print('CV dimension', key, 'status=', dimension['status'],
                    'mm=', dimension['value_mm'], 'reasons=', dimension['reason_codes'],
                    'risks=', dimension['risk_signals'])
          print('CV grounding basis:', json.dumps(evidence['cv_grounding_basis'], ensure_ascii=False))
          print('PHASE2B_SEMANTIC_EVIDENCE:', json.dumps(semantic, ensure_ascii=False, sort_keys=True))
          print('Raw LLM semantic candidate:', json.dumps(
              evidence['llm_semantic_candidate_before_gates'], ensure_ascii=False))
          print('Final head style:', interp['head_style'])
          print('Thread system:', interp['thread_system'])
          print('Nominal specification:', interp['nominal_specification'])
          print('Selected length:', json.dumps(output['selected_length'], ensure_ascii=False))
          print('Purchase gate:', json.dumps(evidence['purchase_gate'], ensure_ascii=False))
          print('Purchase completeness:', json.dumps(evidence['purchase_completeness'], ensure_ascii=False))
          print('Drive evidence:', json.dumps(evidence['drive_evidence'], ensure_ascii=False))
          print('Purchase ready:', output['user_guidance']['purchase_ready'])
          print('Uncertain fields:', json.dumps(output['result']['uncertain_fields'], ensure_ascii=False))
          PY

      - name: Compare with immutable Case E GT only after inference
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('case-e-e2e-results')
          output = json.loads((root / 'response.json').read_text())
          cv = output['measurement']['dimensions']

          # GT enters for the first time here, after response.json is frozen.
          gt = {
              'D': 3.0,
              'P': 0.5,
              'L_underhead': 30.0,
              'head_style': 'socket_cap',
              'thread_system': 'metric',
          }
          dimensions = {}
          for key in ('D', 'P', 'L_underhead'):
              dimension = cv[key]
              measured = dimension['value_mm'] if dimension['status'] == 'measured' else None
              expected = gt[key]
              dimensions[key] = {
                  'status': dimension['status'],
                  'measured_mm': measured,
                  'gt_mm': expected,
                  'absolute_error_mm': abs(measured - expected) if measured is not None else None,
                  'relative_error_pct': 100 * abs(measured - expected) / expected if measured is not None else None,
              }
          for key in ('K', 'DK'):
              dimension = cv[key]
              dimensions[key] = {
                  'status': dimension['status'],
                  'measured_mm': dimension['value_mm'],
                  'gt_mm': None,
                  'relative_error_pct': None,
                  'note': 'No independent K/DK ground truth is recorded for frozen Case E.',
              }

          interp = output['result']['fastener_interpretation']
          evidence = output['specification_evidence']
          raw_candidate = evidence['llm_semantic_candidate_before_gates']
          nominal = interp['nominal_specification']
          compact = re.sub(r'\s+', '', nominal.lower()).replace('×', 'x')
          nominal_core_matches = 'm3' in compact and ('0.5' in compact or '.5' in compact) and '30' in compact
          cv_measurement_pass = all(cv[key]['status'] == 'measured' for key in ('D','P','L_underhead','K','DK'))
          head_pass = interp['head_style'] == gt['head_style']
          length_pass = output['selected_length']['convention'] == 'under_head'
          complete_pass = (
              output['user_guidance']['purchase_ready'] and head_pass and length_pass
              and interp['thread_system'] == gt['thread_system'] and nominal_core_matches
          )
          report = {
              'case': 'E',
              'fixture_sha256': output['measurement']['image_sha256'],
              'original_uploaded_jpeg_sha256': 'f05a8ab6d3188469a1d16648bb58cc0a7348e57d367266aa836e10b114a202af',
              'inference_external_input': ['repository_derivative_image_only'],
              'gt_loaded_after_response': True,
              'workflow_execution_pass': True,
              'cv_measurement_pass': cv_measurement_pass,
              'llm_head_identification_pass': head_pass,
              'complete_purchase_specification_pass': complete_pass,
              'cv_errors': dimensions,
              'raw_llm_semantic_candidate': raw_candidate,
              'output_head_style': interp['head_style'],
              'output_thread_system': interp['thread_system'],
              'nominal_output': nominal,
              'nominal_core_m3_0_5_x_30_matches': nominal_core_matches,
              'expected_length_convention': 'under_head',
              'output_length_convention': output['selected_length']['convention'],
              'length_convention_matches_gt': length_pass,
              'purchase_ready': output['user_guidance']['purchase_ready'],
              'purchase_gate': evidence['purchase_gate'],
              'purchase_completeness': evidence['purchase_completeness'],
              'drive_evidence': evidence['drive_evidence'],
          }
          (root / 'evaluation.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
          print('POST-INFERENCE CASE E GT EVALUATION')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Upload raw inference and post-inference evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case-e-image-only-openai-e2e
          path: |
            case-e-e2e-results/*.json
          if-no-files-found: ignore

      - name: Print sanitized logs on failure
        if: failure()
        shell: bash
        run: |
          echo 'CV service diagnostics:'
          tail -n 70 /tmp/hcsi-e-cv.log 2>/dev/null || true
          echo 'Next.js diagnostics:'
          tail -n 70 /tmp/hcsi-e-next.log 2>/dev/null || true
