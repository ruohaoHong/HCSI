# Standards source-of-truth final validation: formal candidates are catalogue-backed; legacy nominal is diagnostic only.
# Phase 1 shadow-mode branch regression enabled.\nname: Case C locked-fixture blind OpenAI E2E

# Harness only. No CV, prompt, Head Evidence, arithmetic grounding, or provider logic is modified.
# Inference receives only the exact locked Case C image and data produced by the formal pipeline.
# GT is introduced only in the final scoring step after response.json is frozen and hashed.
on:
  push:
    branches: [feature/measurement-confidence-gate, feature/standards-solver-v1, feature/standards-source-of-truth, feature/standards-decision-foundation]
    paths:
      - '.github/workflows/case-c-image-only-openai-e2e.yml'
      - 'lib/provider-runner.ts'
      - 'lib/formal-nominal-projection.ts'
      - 'lib/measurement-uncertainty.ts'
      - 'lib/physical-evidence-likelihood.ts'
      - 'lib/standards-tolerance-model-v1.ts'
      - 'lib/purchase-spec-completeness.ts'
      - 'lib/cv-grounding-basis.ts'
      - 'lib/cv-first-identification.ts'
      - 'lib/identification.ts'
      - 'lib/measurement-v2.ts'
      - 'lib/standards-catalogue.ts'
      - 'lib/standards-database-v1.ts'
      - 'lib/standards-shadow-solver.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  case-c-blind:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HCSI_MEASUREMENT_SERVICE_URL: http://127.0.0.1:8000
      RULERNET_ALLOW_NONCOMMERCIAL_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: measurement-service/requirements.txt

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore exact locked Case C bytes and verify SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_BLOB_SHA: 2a40d0d6031c15fe0fc4b5e590e8392fde8d75dd
          EXPECTED_SHA256: 98896d298c40b87388083bac6e51df0c2d6b18460e9e29a2b7be9899f6201b9f
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p case-c-e2e-results
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${FIXTURE_BLOB_SHA}" --jq '.content' \
            | tr -d '\n' | base64 -d > case-c-e2e-results/case-c-hex-ruler-separated.png
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          path = Path('case-c-e2e-results/case-c-hex-ruler-separated.png')
          raw = path.read_bytes()
          expected = '98896d298c40b87388083bac6e51df0c2d6b18460e9e29a2b7be9899f6201b9f'
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'Case C fixture SHA mismatch: {actual} != {expected}')
          if len(raw) != 600469:
              raise SystemExit(f'Case C fixture byte-size mismatch: {len(raw)} != 600469')
          if not raw.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('Case C fixture is not the locked PNG byte stream')
          Path('case-c-e2e-results/fixture-verification.json').write_text(json.dumps({
              'case': 'C',
              'fixture': 'case-c-hex-ruler-separated.png',
              'sha256': actual,
              'bytes': len(raw),
              'fixture_identity_only': True,
              'ground_truth_loaded': False
          }, indent=2) + '\n')
          print('CASE C FIXTURE SHA-256 VERIFIED:', actual)
          print('Fixture bytes:', len(raw))
          print('No GT, product name, dimensions, or expected head_style loaded into inference.')
          PY

      - name: Install dependencies and build unchanged application
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY unavailable"; exit 1; }
          python -m pip install -r measurement-service/requirements.txt
          pnpm install --frozen-lockfile
          pnpm build

      - name: Start deterministic CV service and Next.js API
        shell: bash
        run: |
          set -euo pipefail
          nohup python -m uvicorn app:app --app-dir measurement-service --host 127.0.0.1 --port 8000 > /tmp/hcsi-c-cv.log 2>&1 < /dev/null &
          nohup pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/hcsi-c-next.log 2>&1 < /dev/null &
          python - <<'PY'
          import time, urllib.request
          for url in ['http://127.0.0.1:8000/openapi.json', 'http://127.0.0.1:3000']:
              for _ in range(100):
                  try:
                      with urllib.request.urlopen(url, timeout=3) as response:
                          if response.status == 200:
                              print('Ready:', url)
                              break
                  except Exception:
                      time.sleep(2)
              else:
                  raise SystemExit('Service did not start: ' + url)
          PY

      - name: Blind Stage 1 -> deterministic CV -> Stage 2 OpenAI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, pathlib, urllib.error, urllib.request
          root = pathlib.Path('case-c-e2e-results')
          image = (root / 'case-c-hex-ruler-separated.png').read_bytes()
          encoded = base64.b64encode(image).decode('ascii')

          def post(route, body):
              request = urllib.request.Request(
                  'http://127.0.0.1:3000' + route,
                  data=json.dumps(body).encode('utf-8'),
                  headers={'Content-Type': 'application/json'},
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(request, timeout=900) as response:
                      status, raw = response.status, response.read()
              except urllib.error.HTTPError as error:
                  status, raw = error.code, error.read()
              if status != 200:
                  try:
                      payload = json.loads(raw)
                  except Exception:
                      payload = {'raw': raw.decode(errors='replace')[:4000]}
                  (root / 'inference-error.json').write_text(
                      json.dumps({'route': route, 'status': status, 'payload': payload},
                                 ensure_ascii=False, indent=2))
                  raise SystemExit(f'{route} HTTP {status}: ' + raw.decode(errors='replace')[:1200])
              return json.loads(raw)

          # Stage 1 receives only the exact image.
          preflight = post('/api/measure', {'image': encoded})
          (root / 'preflight.json').write_text(json.dumps(preflight, ensure_ascii=False, indent=2))
          localization = preflight.get('semantic_localization')
          (root / 'stage1.json').write_text(json.dumps(localization, ensure_ascii=False, indent=2))

          cv = preflight['measurement']
          proof = preflight.get('measurement_proof')
          assert isinstance(proof, str) and proof
          assert localization and localization['semantic_vision']['target_region']['present']
          assert cv['object'].get('semantic_routing_supplied') is True
          assert cv['image_sha256'] == '98896d298c40b87388083bac6e51df0c2d6b18460e9e29a2b7be9899f6201b9f'
          assert set(cv['dimensions']) == {'D','P','L_underhead','L_overall','B','K','DK'}
          (root / 'cv.json').write_text(json.dumps(cv, ensure_ascii=False, indent=2))

          # Stage 2 receives the same image plus only the signed CV produced above.
          output = post('/api/analyze-openai', {
              'image': encoded,
              'measurement': cv,
              'measurement_proof': proof,
          })
          assert output['measurement_source'] == 'signed_preflight_reused'
          assert output.get('semantic_roi_source') == 'signed_preflight'
          assert output['measurement'] == cv
          # Phase 1 standards shadow regression: architecture assertions only.
          shadow = output['standards_solver_shadow']
          authority = output['standards_authority']
          assert authority['mode'] == 'standards_authority'
          assert authority['contract_version'] == 'hcsi.standards-authority.v1'
          assert authority['decision']['status'] == 'unresolved'
          assert authority['decision']['selected_candidate_id'] is None
          assert authority['decision']['purchase_ready'] is False
          assert output['formal_nominal_projection'] is None
          uncertainty = authority['measurement_v2']['uncertainty']
          assert uncertainty['schema_version'] == 'hcsi.measurement-uncertainty.v1'
          assert uncertainty['covariance']['null_semantics'] == 'not_estimated'
          assert isinstance(uncertainty['systematic_bias_ledger'], list)
          assert any(item['type'] == 'depth_parallax' for item in uncertainty['systematic_bias_ledger'])
          assert all(item.get('physical_evidence',{}).get('semantics') == 'measurement_compatibility_not_posterior_probability' for item in authority['formal_candidates'])
          assert all(item.get('physical_evidence',{}).get('tolerance',{}).get('status') in ['available','unavailable'] for item in authority['formal_candidates'])
          assert output['user_guidance']['purchase_ready'] is False
          assert output['user_guidance']['formal_nominal_source'] == 'versioned_standards_solver'
          assert output['user_guidance']['selected_candidate_id'] is None
          formal_designations = [item['designation'] for item in authority['formal_candidates']]
          assert "M14 × 2.0" in formal_designations
          assert '9/16-12 UNC' in formal_designations
          assert not any('#37-12' in item for item in formal_designations)
          aobs = {item['quantity']: item['value_mm'] for item in authority['measurement_v2']['observations']}
          assert abs(aobs['D'] - 13.700) < 1e-9
          assert abs(aobs['P'] - 2.051) < 1e-9
          assert abs(aobs['L_underhead'] - 47.540) < 1e-9
          am14 = next(item for item in authority['formal_candidates'] if item['designation'] == 'M14 × 2.0')
          al45 = next(item for item in am14['length_comparison']['hypotheses'] if abs(item['nominal_mm'] - 45.0) < 1e-9)
          assert abs(al45['residual_mm'] - 2.540) < 1e-9
          assert any(item['standard_system'] == 'iso_metric' for item in authority['formal_candidates'])
          assert any(item['standard_system'] == 'unified_inch' for item in authority['formal_candidates'])
          assert authority['legacy_diagnostics']['llm_nominal']['authority'] == 'non_authoritative'
          assert authority['legacy_diagnostics']['dimension_candidate']['authority'] == 'non_authoritative'
          assert shadow['mode'] == 'shadow'
          assert shadow['purchase_ready'] is False
          assert shadow['candidate_summary']['iso_metric'] > 0
          assert shadow['candidate_summary']['unified_inch'] > 0
          obs = {item['quantity']: item['value_mm'] for item in shadow['measurement_v2']['observations']}
          for key in ('D','P','L_underhead'):
              assert abs(obs[key] - cv['dimensions'][key]['value_mm']) < 1e-9
          assert abs(obs['D'] - 13.700) < 0.001
          assert abs(obs['P'] - 2.051) < 0.001
          assert abs(obs['L_underhead'] - 47.540) < 0.001
          designations = [item['designation'] for item in shadow['new_candidates']]
          assert 'M14 × 2.0' in designations
          assert '9/16-12 UNC' in designations
          assert not any('#37-12' in item for item in designations)
          # Legacy LLM nominal is diagnostic-only and may vary; formal universe must remain catalogue-only.
          m14 = next(item for item in shadow['new_candidates'] if item['designation'] == 'M14 × 2.0')
          assert m14['nominal']['length_mm'] is None
          assert m14['length_comparison']['observed_mm'] == obs['L_underhead']
          assert m14['length_comparison']['product_standard_length_validation'] == 'not_implemented_phase1'
          assert any(abs(h['nominal_mm'] - 45.0) < 1e-9 and abs(h['residual_mm'] - 2.540) < 0.001
                     for h in m14['length_comparison']['hypotheses'])
          assert shadow['scoring_state']['covariance_available'] is False
          assert shadow['scoring_state']['calibrated_probability_available'] is False


          response_path = root / 'response.json'
          response_path.write_text(json.dumps(output, ensure_ascii=False, indent=2))
          response_sha = hashlib.sha256(response_path.read_bytes()).hexdigest()
          (root / 'response-freeze.json').write_text(json.dumps({
              'response_sha256': response_sha,
              'frozen_before_gt_scoring': True,
              'fixture_sha256': cv['image_sha256'],
          }, indent=2) + '\n')
          response_path.chmod(0o444)

          print('CASE C BLIND E2E INFERENCE COMPLETED')
          print('Stage 1 localization:', json.dumps(localization, ensure_ascii=False))
          print('CV status:', cv['measurement_status'])
          print('CV confidence:', cv['measurement_confidence'])
          for key in ('D','P','L_underhead','L_overall','K','DK'):
              d = cv['dimensions'][key]
              print('CV dimension', key, 'status=', d['status'], 'mm=', d['value_mm'],
                    'reasons=', d['reason_codes'], 'risks=', d['risk_signals'])
          evidence = output['specification_evidence']
          print('CV grounding basis:', json.dumps(evidence['cv_grounding_basis'], ensure_ascii=False))
          print('Raw Stage 2 semantic candidate:',
                json.dumps(evidence['llm_semantic_candidate_before_gates'], ensure_ascii=False))
          print('Final head style:', output['result']['fastener_interpretation']['head_style'])
          print('Thread system:', output['result']['fastener_interpretation']['thread_system'])
          print('Nominal specification:', output['result']['fastener_interpretation']['nominal_specification'])
          print('Selected length:', json.dumps(output['selected_length'], ensure_ascii=False))
          print('Purchase description:', output['result']['purchase_description'])
          print('Purchase ready:', output['user_guidance']['purchase_ready'])
          print('Response SHA-256 frozen:', response_sha)
          PY

      - name: Post-inference GT scoring only after frozen response exists
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, re
          root = pathlib.Path('case-c-e2e-results')
          response_path = root / 'response.json'
          freeze = json.loads((root / 'response-freeze.json').read_text())
          actual_response_sha = hashlib.sha256(response_path.read_bytes()).hexdigest()
          if actual_response_sha != freeze['response_sha256']:
              raise SystemExit('Frozen Stage 2 response changed before GT scoring')

          # Ground truth enters the test process for the first time here.
          gt = {
              'D': 14.0,
              'P': 2.0,
              'L_underhead': 45.0,
              'head_style': 'hex',
              'thread_system': 'metric',
              'length_convention': 'under_head',
          }
          output = json.loads(response_path.read_text())
          cv = output['measurement']['dimensions']

          errors = {}
          for key in ('D','P','L_underhead'):
              d = cv[key]
              measured = d['value_mm'] if d['status'] == 'measured' else None
              expected = gt[key]
              errors[key] = {
                  'status': d['status'],
                  'measured_mm': measured,
                  'gt_mm': expected,
                  'absolute_error_mm': abs(measured - expected) if measured is not None else None,
                  'relative_error_pct': 100 * abs(measured - expected) / expected if measured is not None else None,
              }
          for key in ('K','DK'):
              d = cv[key]
              errors[key] = {
                  'status': d['status'],
                  'measured_mm': d['value_mm'],
                  'gt_mm': None,
                  'absolute_error_mm': None,
                  'relative_error_pct': None,
                  'note': 'No independent locked K/DK ground truth exists for active Case C.'
              }

          interp = output['result']['fastener_interpretation']
          nominal = interp['nominal_specification']
          compact = re.sub(r'\s+', '', nominal.lower()).replace('×', 'x')
          dimension_core_matches = (
              'm14' in compact and
              ('2.0' in compact or '2mm' in compact) and
              '45' in compact
          )
          head_matches = interp['head_style'] == gt['head_style']
          thread_matches = interp['thread_system'] == gt['thread_system']
          length_matches = output['selected_length']['convention'] == gt['length_convention']
          complete_purchase_spec = (
              bool(output['user_guidance']['purchase_ready'])
              and dimension_core_matches
              and head_matches
              and thread_matches
              and length_matches
          )

          report = {
              'case': 'C',
              'fixture_sha256': output['measurement']['image_sha256'],
              'response_sha256': actual_response_sha,
              'gt_loaded_after_response_frozen': True,
              'ground_truth': {
                  'D_mm': gt['D'],
                  'P_mm': gt['P'],
                  'L_mm': gt['L_underhead'],
                  'head_style': gt['head_style'],
                  'thread_system': gt['thread_system'],
                  'length_convention': gt['length_convention'],
              },
              'cv_errors': errors,
              'output_head_style': interp['head_style'],
              'head_style_correct': head_matches,
              'output_thread_system': interp['thread_system'],
              'thread_system_correct': thread_matches,
              'output_length_convention': output['selected_length']['convention'],
              'length_convention_correct': length_matches,
              'nominal_specification': nominal,
              'purchase_description': output['result']['purchase_description'],
              'purchase_ready': output['user_guidance']['purchase_ready'],
              'dimension_core_matches_gt': dimension_core_matches,
              'purchase_specification_complete_correct': complete_purchase_spec,
          }
          (root / 'evaluation.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
          print('POST-INFERENCE CASE C GT EVALUATION')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Upload frozen blind E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case-c-locked-blind-openai-e2e
          path: |
            case-c-e2e-results/fixture-verification.json
            case-c-e2e-results/stage1.json
            case-c-e2e-results/preflight.json
            case-c-e2e-results/cv.json
            case-c-e2e-results/response.json
            case-c-e2e-results/response-freeze.json
            case-c-e2e-results/evaluation.json
            case-c-e2e-results/inference-error.json
          if-no-files-found: ignore

      - name: Print sanitized application logs on failure
        if: failure()
        shell: bash
        run: |
          echo 'CV service diagnostics:'
          tail -n 70 /tmp/hcsi-c-cv.log 2>/dev/null || true
          echo 'Next.js diagnostics:'
          tail -n 70 /tmp/hcsi-c-next.log 2>/dev/null || true
