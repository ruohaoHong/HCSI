name: Measurement PoC

permissions:
  contents: read
  actions: read

on:
  push:
    paths:
      - 'measurement-service/**'
      - 'benchmark/measurement-poc/**'
      - 'lib/measurement.ts'
      - 'lib/measurement-client.ts'
      - 'lib/measurement-prompt.ts'
      - 'lib/identification.ts'
      - 'lib/provider-runner.ts'
      - 'app/api/measure/**'
      - 'app/page.tsx'
      - '.github/workflows/measurement-poc.yml'
  pull_request:
    paths:
      - 'measurement-service/**'
      - 'benchmark/measurement-poc/**'
      - 'lib/measurement.ts'
      - 'lib/measurement-client.ts'
      - 'lib/measurement-prompt.ts'
      - 'lib/identification.ts'
      - 'lib/provider-runner.ts'
      - 'app/api/measure/**'
      - 'app/page.tsx'
      - '.github/workflows/measurement-poc.yml'

jobs:
  python-tests:
    runs-on: ubuntu-latest
    env:
      RULERNET_ALLOW_NONCOMMERCIAL_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: measurement-service/requirements.txt
      - run: pip install -r measurement-service/requirements.txt pytest
      - run: pytest -q measurement-service/tests
      - name: Verify benchmark scoring example
        run: python benchmark/measurement-poc/score.py benchmark/measurement-poc/example.json
      - name: Download locked real-case A/B fixtures
        uses: actions/download-artifact@v4
        with:
          name: real-acceptance-ab
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ruohaoHong/HCSI
          run-id: 35753143674
          path: /tmp/hcsi-real-fixtures
      - name: Download locked real-case D fixture
        uses: actions/download-artifact@v4
        with:
          name: real-case-d
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ruohaoHong/HCSI
          run-id: 36009560609
          path: /tmp/hcsi-real-fixtures
      - name: Reassemble and verify repository Case E derivative
        run: python benchmark/measurement-poc/assemble_case_e_fixture.py --output /tmp/hcsi-real-fixtures/case-e.webp
      - name: Run frozen B/D/E measurement regression
        run: |
          python benchmark/measurement-poc/run_fixed_confidence_cases.py \
            --service-dir measurement-service \
            --fixture-dir /tmp/hcsi-real-fixtures \
            --output /tmp/hcsi-real-bde.json \
            --label cv-first-v2 \
            --cases B D E
      - name: Upload B/D/E regression diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: cv-first-v2-real-bde
          path: /tmp/hcsi-real-bde.json
