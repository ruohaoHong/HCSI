name: OpenAI Secret Smoke Test

on:
  push:
    paths:
      - '.github/workflows/openai-secret-smoke.yml'
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Verify secret exists
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not available to this workflow."
            exit 1
          fi
          echo "OPENAI_API_KEY is available (value not printed)."

      - name: Call OpenAI Responses API
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          payload = {
              "model": "gpt-5.6-sol",
              "input": "Reply with exactly: HCSI_SMOKE_OK",
              "max_output_tokens": 64,
          }
          body = json.dumps(payload).encode("utf-8")
          request = urllib.request.Request(
              "https://api.openai.com/v1/responses",
              data=body,
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {os.environ['OPENAI_API_KEY']}",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  status = response.status
                  raw = response.read().decode("utf-8")
          except urllib.error.HTTPError as exc:
              status = exc.code
              raw = exc.read().decode("utf-8", errors="replace")

          print("OpenAI HTTP status:", status)
          data = json.loads(raw)

          if status < 200 or status >= 300:
              err = data.get("error", {})
              print("OpenAI error type:", err.get("type", "unknown"))
              print("OpenAI error code:", err.get("code", "unknown"))
              print("OpenAI error message:", err.get("message", "unknown"))
              raise SystemExit(1)

          text = ""
          for item in data.get("output", []):
              for content in item.get("content", []):
                  if content.get("type") == "output_text":
                      text += content.get("text", "")

          print("Model response:", text.strip())
          if text.strip() != "HCSI_SMOKE_OK":
              raise SystemExit("API call succeeded but expected exact smoke-test response was not found.")

          print("OpenAI smoke test passed.")
          PY
