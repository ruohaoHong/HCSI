name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Smoke test deterministic length convention resolver
        run: |
          rm -rf /tmp/hcsi-resolver-test
          pnpm exec tsc \
            lib/geometry-capabilities.ts \
            lib/measurement-plan-resolver.ts \
            benchmark/measurement-poc/test_measurement_plan_resolver.ts \
            --target ES2022 \
            --module commonjs \
            --moduleResolution node \
            --esModuleInterop \
            --skipLibCheck \
            --outDir /tmp/hcsi-resolver-test
          node /tmp/hcsi-resolver-test/benchmark/measurement-poc/test_measurement_plan_resolver.js
      - name: CV-first length policy regression (including LLM head=other)
        run: |
          rm -rf /tmp/hcsi-cv-first-policy-test
          pnpm exec tsc lib/cv-length-policy.ts lib/cv-length-policy.test.ts \
            --target ES2022 --module commonjs --moduleResolution node \
            --esModuleInterop --skipLibCheck --outDir /tmp/hcsi-cv-first-policy-test
          node "$(find /tmp/hcsi-cv-first-policy-test -name cv-length-policy.test.js -print -quit)"
      - name: CV purchase gate regression
        run: |
          rm -rf /tmp/hcsi-purchase-gate-test
          pnpm exec tsc lib/cv-purchase-policy.ts lib/cv-purchase-policy.test.ts \
            --target ES2022 --module commonjs --moduleResolution node \
            --esModuleInterop --skipLibCheck --outDir /tmp/hcsi-purchase-gate-test
          node "$(find /tmp/hcsi-purchase-gate-test -name cv-purchase-policy.test.js -print -quit)"
      - name: CV-first v2 head and drive evidence regression
        run: |
          rm -rf /tmp/hcsi-cv-first-v2-test
          pnpm exec tsc \
            lib/head-style-consistency.ts \
            lib/head-style-consistency.test.ts \
            lib/head-style-taxonomy.ts \
            lib/head-style-taxonomy.test.ts \
            lib/drive-evidence.ts \
            lib/drive-evidence.test.ts \
            lib/purchase-spec-completeness.ts \
            lib/purchase-spec-completeness.test.ts \
            lib/cv-grounding-basis.ts \
            lib/cv-grounding-basis.test.ts \
            lib/cv-first-v2-integration.test.ts \
            --target ES2022 --module commonjs --moduleResolution node \
            --esModuleInterop --skipLibCheck --outDir /tmp/hcsi-cv-first-v2-test
          node "$(find /tmp/hcsi-cv-first-v2-test -name head-style-consistency.test.js -print -quit)"
          node "$(find /tmp/hcsi-cv-first-v2-test -name head-style-taxonomy.test.js -print -quit)"
          node "$(find /tmp/hcsi-cv-first-v2-test -name drive-evidence.test.js -print -quit)"
          node "$(find /tmp/hcsi-cv-first-v2-test -name purchase-spec-completeness.test.js -print -quit)"
          node "$(find /tmp/hcsi-cv-first-v2-test -name cv-grounding-basis.test.js -print -quit)"
          node "$(find /tmp/hcsi-cv-first-v2-test -name cv-first-v2-integration.test.js -print -quit)"
      - name: Semantic calibration deterministic suites
        run: |
          rm -rf /tmp/hcsi-semantic-calibration-tests
          pnpm exec tsc             lib/semantic-calibration.test.ts             lib/semantic-calibration-phase2e.test.ts             lib/semantic-calibration-phase2e1.test.ts             lib/semantic-calibration-phase2e1-1.test.ts             lib/semantic-calibration-phase2e1-2.test.ts             lib/semantic-calibration-phase2f.test.ts             lib/semantic-calibration-phase2f1.test.ts             lib/semantic-calibration-phase2f2-real-corpus.test.ts             lib/semantic-calibration-phase2f3.test.ts             lib/semantic-calibration-phase2g.test.ts             scripts/validate-semantic-calibration-corpus.ts             --target ES2022             --module commonjs             --moduleResolution node             --esModuleInterop             --skipLibCheck             --outDir /tmp/hcsi-semantic-calibration-tests
          node "$(find /tmp/hcsi-semantic-calibration-tests -name semantic-calibration.test.js -print -quit)"
          node "$(find /tmp/hcsi-semantic-calibration-tests -name semantic-calibration-phase2e.test.js -print -quit)"
          node "$(find /tmp/hcsi-semantic-calibration-tests -name semantic-calibration-phase2e1.test.js -print -quit)"
          node "$(find /tmp/hcsi-semantic-calibration-tests -name semantic-calibration-phase2e1-1.test.js -print -quit)"
          node "$(find /tmp/hcsi-semantic-calibration-tests -name semantic-calibration-phase2e1-2.test.js -print -quit)"
          node "$(find /tmp/hcsi-semantic-calibration-tests -name semantic-calibration-phase2f.test.js -print -quit)"
          node "$(find /tmp/hcsi-semantic-calibration-tests -name semantic-calibration-phase2f1.test.js -print -quit)"
          node "$(find /tmp/hcsi-semantic-calibration-tests -name semantic-calibration-phase2f2-real-corpus.test.js -print -quit)"
          node "$(find /tmp/hcsi-semantic-calibration-tests -name semantic-calibration-phase2f3.test.js -print -quit)"
          node "$(find /tmp/hcsi-semantic-calibration-tests -name semantic-calibration-phase2g.test.js -print -quit)"
      - run: pnpm build
