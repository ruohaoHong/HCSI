# Phase 2C final validation: same-HEAD acceptance trigger; no production logic change.
# Phase 2C candidate feature compiler + candidate-blind targeted semantic discrimination.
# Phase 2B.1 semantic anti-leak hardening: finite reason codes + OCR literal policy.
# Phase 2B final validation: candidate-blind semantic evidence v1 shadow architecture.
# Phase 2B deterministic semantic evidence validation; F/G intentionally excluded.
# Phase 2A.1 final validation: fail-closed bias/covariance gates and nominal-proximity density semantics.
# Phase 2A.1 fail-closed hardening: bias authorization + covariance readiness + local density semantics.
# Standards source-of-truth final deterministic validation; F/G are intentionally out of scope.
name: Standards Solver v1 Phase 1

on:
  push:
    branches: [feature/standards-solver-v1, feature/standards-source-of-truth, feature/standards-decision-foundation, feature/physical-likelihood-hardening, feature/semantic-evidence-v1, feature/semantic-evidence-anti-leak, feature/candidate-semantic-discrimination]
    paths:
      - 'lib/measurement-v2.ts'
      - 'lib/measurement-v2.test.ts'
      - 'lib/standards-catalogue.ts'
      - 'lib/standards-catalogue.test.ts'
      - 'lib/standards-database-v1.ts'
      - 'lib/standards-shadow-solver.ts'
      - 'lib/standards-shadow-solver.test.ts'
      - 'lib/standards-authority.test.ts'
      - 'lib/formal-nominal-projection.ts'
      - 'lib/formal-nominal-projection.test.ts'
      - 'lib/measurement-uncertainty.ts'
      - 'lib/measurement-uncertainty.test.ts'
      - 'lib/standards-tolerance-model-v1.ts'
      - 'lib/physical-evidence-likelihood.ts'
      - 'lib/physical-evidence-likelihood.test.ts'
      - 'lib/physical-evidence-hardening.test.ts'
      - 'lib/semantic-taxonomy-v1.ts'
      - 'lib/semantic-reason-codes-v1.ts'
      - 'lib/candidate-feature-metadata-v1.ts'
      - 'lib/candidate-feature-compiler.ts'
      - 'lib/semantic-discrimination-plan-v1.ts'
      - 'lib/targeted-semantic-request.ts'
      - 'lib/targeted-semantic-extractor.ts'
      - 'lib/candidate-semantic-discrimination.ts'
      - 'lib/candidate-semantic-discrimination.test.ts'
      - 'lib/semantic-evidence-v1.ts'
      - 'lib/candidate-blind-semantic-request.ts'
      - 'lib/semantic-evidence-validator.ts'
      - 'lib/semantic-extractor.ts'
      - 'lib/semantic-evidence.test.ts'
      - 'lib/purchase-spec-completeness.ts'
      - 'lib/cv-first-identification.ts'
      - 'lib/phase1-regression.test.ts'
      - 'lib/provider-runner.ts'
      - '.github/workflows/standards-solver-v1-phase1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile Phase 1 contracts, DB, solver and tests
        run: |
          rm -rf /tmp/hcsi-standards-v1
          pnpm exec tsc             lib/measurement.ts             lib/measurement-v2.ts             lib/measurement-v2.test.ts             lib/standards-catalogue.ts             lib/standards-database-v1.ts             lib/standards-catalogue.test.ts             lib/standards-shadow-solver.ts             lib/standards-shadow-solver.test.ts             lib/standards-authority.test.ts             lib/formal-nominal-projection.ts             lib/formal-nominal-projection.test.ts             lib/measurement-uncertainty.ts             lib/measurement-uncertainty.test.ts             lib/standards-tolerance-model-v1.ts             lib/physical-evidence-likelihood.ts             lib/physical-evidence-likelihood.test.ts             lib/physical-evidence-hardening.test.ts             lib/semantic-taxonomy-v1.ts             lib/semantic-reason-codes-v1.ts             lib/semantic-evidence-v1.ts             lib/candidate-feature-metadata-v1.ts             lib/candidate-feature-compiler.ts             lib/semantic-discrimination-plan-v1.ts             lib/targeted-semantic-request.ts             lib/targeted-semantic-extractor.ts             lib/candidate-semantic-discrimination.ts             lib/candidate-semantic-discrimination.test.ts             lib/candidate-blind-semantic-request.ts             lib/semantic-evidence-validator.ts             lib/semantic-extractor.ts             lib/semantic-evidence.test.ts             lib/phase1-regression.test.ts             --target ES2022 --module commonjs --moduleResolution node             --esModuleInterop --skipLibCheck --strict             --outDir /tmp/hcsi-standards-v1
      - name: Run Phase 1 deterministic tests
        run: |
          node "$(find /tmp/hcsi-standards-v1 -name measurement-v2.test.js -print -quit)"
          node "$(find /tmp/hcsi-standards-v1 -name standards-catalogue.test.js -print -quit)"
          node "$(find /tmp/hcsi-standards-v1 -name standards-shadow-solver.test.js -print -quit)"
          node "$(find /tmp/hcsi-standards-v1 -name standards-authority.test.js -print -quit)"
          node "$(find /tmp/hcsi-standards-v1 -name formal-nominal-projection.test.js -print -quit)"
          node "$(find /tmp/hcsi-standards-v1 -name measurement-uncertainty.test.js -print -quit)"
          node "$(find /tmp/hcsi-standards-v1 -name physical-evidence-likelihood.test.js -print -quit)"
          node "$(find /tmp/hcsi-standards-v1 -name physical-evidence-hardening.test.js -print -quit)"
          node "$(find /tmp/hcsi-standards-v1 -name semantic-evidence.test.js -print -quit)"
          node "$(find /tmp/hcsi-standards-v1 -name phase1-regression.test.js -print -quit)"
