name: Collect Plastic Anchor Images

on:
  push:
    paths:
      - '.github/workflows/collect-plastic-anchor-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: pip install pillow requests

      - name: Download and validate candidate photos
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, io
          import requests
          from PIL import Image, ImageOps, ImageDraw

          candidates = [
            {
              'id': 'C01',
              'url': 'https://i.imgur.com/kB7xjYJ.jpeg',
              'source': 'https://www.ptt.cc/bbs/e-shopping/M.1700402254.A.093.html',
              'note': 'PTT user photo; post explicitly says this is the 6 mm wall anchor they bought.'
            },
            {
              'id': 'C02',
              'url': 'https://i.imgur.com/ZMA30Ye.jpeg',
              'source': 'https://www.ptt.cc/bbs/FixMyHouse/M.1729942004.A.3F0.html',
              'note': 'PTT user photo; post explicitly calls this the included green wall anchor.'
            },
            {
              'id': 'C03',
              'url': 'https://i.imgur.com/zjkWl8N.jpg',
              'source': 'https://www.ptt.cc/bbs/FixMyHouse/M.1700365154.A.B4B.html',
              'note': 'PTT user photo explicitly captioned plastic wall anchor.'
            },
            {
              'id': 'C04',
              'url': 'https://i.imgur.com/tccFzzy.jpg',
              'source': 'https://www.ptt.cc/bbs/FixMyHouse/M.1700365154.A.B4B.html',
              'note': 'PTT user photo explicitly captioned plastic wall anchor and masonry bit.'
            },
            {
              'id': 'C05',
              'url': 'https://i.imgur.com/8uzO1Mp.jpg',
              'source': 'https://www.ptt.cc/bbs/FixMyHouse/M.1700365154.A.B4B.html',
              'note': 'PTT user comparison photo with the same physical plastic wall anchor and drill bits.'
            },
            {
              'id': 'C06',
              'url': 'https://i.imgur.com/nlKPIoz.jpeg',
              'source': 'https://www.ptt.cc/bbs/FixMyHouse/M.1734960751.A.8DD.html',
              'note': 'PTT user photo; post discusses this physical wall anchor and its open tip.'
            },
            {
              'id': 'C07',
              'url': 'https://i.imgur.com/dYhny2L.jpeg',
              'source': 'https://www.ptt.cc/bbs/FixMyHouse/M.1734960751.A.8DD.html',
              'note': 'PTT user photo; post discusses this physical wall anchor and its closed tip.'
            },
            {
              'id': 'C08',
              'url': 'https://i.imgur.com/wX2IwOr.jpg',
              'source': 'https://www.ptt.cc/bbs/PC_Shopping/M.1652118729.A.221.html',
              'note': 'PTT user photo; post identifies supplied grey plastic anchor as 10 x 50 mm.'
            },
            {
              'id': 'C09',
              'url': 'https://attach.mobile01.com/attach/201209/mobile01-09b31ce0176e717ca44864c16f615ace.jpg',
              'source': 'https://www.mobile01.com/topicdetail.php?f=335&t=2960644',
              'note': 'Mobile01 DIY user photo; text immediately identifies the right-hand item as a plastic wall anchor.'
            },
            {
              'id': 'C10',
              'url': 'https://attach.mobile01.com/attach/201209/mobile01-6582556846c281fd44f4e7d928bcdc07.jpg',
              'source': 'https://www.mobile01.com/topicdetail.php?f=335&t=2960644',
              'note': 'Second Mobile01 user photo in the same real DIY wall-anchor comparison.'
            },
            {
              'id': 'C11',
              'url': 'https://attach.mobile01.com/attach/201209/mobile01-d76607e912407038770a6c4dd00bb01f.jpg',
              'source': 'https://www.mobile01.com/topicdetail.php?f=335&t=2960644',
              'note': 'Mobile01 reply photo immediately under text calling this a household plastic plug/anchor.'
            },
            {
              'id': 'C12',
              'url': 'https://attach.mobile01.com/attach/201802/mobile01-e1c19ad2dc9c719bae73511eb04a9885.jpg',
              'source': 'https://www.mobile01.com/topicdetail.php?f=360&p=2&t=5399743',
              'note': 'Mobile01 user comparison photo showing a white nylon self-drilling wall anchor.'
            },
          ]

          out = Path('plastic-anchor-candidates')
          out.mkdir(exist_ok=True)
          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0 HCSI benchmark image collector'})
          manifest = []

          for c in candidates:
            print(f"Downloading {c['id']} {c['url']}")
            try:
              headers = {'Referer': c['source']}
              r = session.get(c['url'], headers=headers, timeout=40)
              status = r.status_code
              ct = r.headers.get('content-type', '')
              if status != 200:
                raise RuntimeError(f'HTTP {status}')
              if len(r.content) < 1000:
                raise RuntimeError(f'too small: {len(r.content)} bytes')
              img = Image.open(io.BytesIO(r.content))
              img.load()
              w, h = img.size
              if w < 180 or h < 180:
                raise RuntimeError(f'image too small: {w}x{h}')
              fmt = (img.format or 'JPEG').upper()
              ext = '.png' if fmt == 'PNG' else '.jpg'
              path = out / f"{c['id']}{ext}"
              if fmt == 'PNG':
                img.save(path, 'PNG')
              else:
                img.convert('RGB').save(path, 'JPEG', quality=95)
              sha = hashlib.sha256(path.read_bytes()).hexdigest()
              row = {**c, 'ok': True, 'http_status': status, 'content_type': ct,
                     'width': w, 'height': h, 'sha256': sha, 'file': path.name}
              print(f"OK {c['id']}: {w}x{h}, {path.stat().st_size} bytes")
            except Exception as e:
              row = {**c, 'ok': False, 'error': str(e)}
              print(f"FAIL {c['id']}: {e}")
            manifest.append(row)

          ok = [m for m in manifest if m['ok']]
          (out / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')

          if len(ok) < 10:
            raise SystemExit(f'Only {len(ok)} valid images downloaded; need at least 10')

          # Create contact sheet for human review; no semantic image generation/editing.
          thumbs = []
          for m in ok:
            im = Image.open(out / m['file']).convert('RGB')
            im = ImageOps.contain(im, (420, 320))
            canvas = Image.new('RGB', (460, 390), 'white')
            x = (460 - im.width)//2
            y = 10 + (320 - im.height)//2
            canvas.paste(im, (x, y))
            d = ImageDraw.Draw(canvas)
            d.text((12, 342), f"{m['id']}  {m['width']}x{m['height']}", fill='black')
            d.text((12, 362), m['source'][:60], fill='black')
            thumbs.append(canvas)
          cols = 2
          rows = (len(thumbs)+cols-1)//cols
          sheet = Image.new('RGB', (cols*460, rows*390), 'white')
          for i,im in enumerate(thumbs):
            sheet.paste(im, ((i%cols)*460, (i//cols)*390))
          sheet.save(out / 'contact-sheet.jpg', 'JPEG', quality=92)
          print(f'Downloaded {len(ok)} valid candidate images')
          PY

      - name: Upload candidate images
        uses: actions/upload-artifact@v4
        with:
          name: plastic-anchor-candidates
          path: plastic-anchor-candidates/
          if-no-files-found: error
          retention-days: 7
