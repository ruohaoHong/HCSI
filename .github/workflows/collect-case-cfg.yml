name: Collect Case C/F/G Supplier Photo Fixtures
# One-time photo acquisition / SHA audit only. Does not call paid OpenAI API.
on:
  push:
    branches: [feature/measurement-confidence-gate]
    paths:
      - '.github/workflows/collect-case-cfg.yml'
      - 'benchmark/measurement-poc/collect_case_cfg.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=10,<13'
      - name: Restore historical immutable Case C for photo similarity check
        env:
          GH_TOKEN: {{ github.token }}
        shell: bash
        run: |
          mkdir -p /tmp/hcsi-old-c
          gh run download 35898262179 --repo "$GITHUB_REPOSITORY" --name real-case-c --dir /tmp/hcsi-old-c || echo "Historical C comparison unavailable (nonfatal)."
      - name: Download only the three approved supplier photo URLs and verify image bytes
        run: python benchmark/measurement-poc/collect_case_cfg.py
      - name: Upload exact supplier images and SHA metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcsi-case-cfg-supplier-fixtures
          path: case-cfg-fixtures/*
          retention-days: 90
          if-no-files-found: warn
