name: Plastic Anchor 10 Benchmark

on:
  push:
    paths:
      - '.github/workflows/plastic-anchor-10-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Download previously validated real-image artifact
        uses: actions/download-artifact@v5
        with:
          name: plastic-anchor-candidates
          path: plastic-anchor-images
          run-id: 34381245342
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests
      - name: Verify exact selected images and run OpenAI benchmark
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, os, requests
          from PIL import Image

          root=Path('plastic-anchor-images')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          byid={x['id']:x for x in manifest}
          selected=['TW01','CM01','CM02','CM03','CM04','CM06','CM07','CM09','CM10','CM11']
          out=Path('plastic-anchor-10-results'); out.mkdir(exist_ok=True)
          prompt='''你正在協助台灣使用者辨識照片中的五金零件。只根據照片本身判斷，不得使用來源頁、Ground Truth 或外部資料。目標是讓使用者能拿答案去台灣五金行購買可用替代品。不要因為需要完整答案而猜測照片無法支持的尺寸、材質或型號；不能可靠判定就寫 unknown。名稱優先使用台灣常見繁體中文購買用語。照片可能包含一個或多個同類零件。只輸出 JSON：{"item_name_zh_tw":"","common_names_zh_tw":[],"technical_name_en":"","object_count_or_scope":"","material":"visible/inferable value or unknown","diameter_mm":"number/list/range or unknown","length_mm":"number/list/range or unknown","purchase_phrase_zh_tw":"","missing_purchase_info":[],"confidence":0.0,"diagnostic":{"key_visual_evidence":[],"size_evidence":"","uncertain_points":[]}}'''
          rows=[]
          # Global preflight: exact bytes must match the hashes recorded when the images were collected/validated.
          for cid in selected:
            m=byid[cid]; p=root/m['file']; data=p.read_bytes(); sha=hashlib.sha256(data).hexdigest()
            if sha != m['sha256']: raise SystemExit(f'{cid} hash mismatch: {sha} != {m["sha256"]}')
            with Image.open(p) as im: im.verify()
          print('PRE-FLIGHT: all 10 exact validated images passed hash + Pillow verification')
          key=os.environ['OPENAI_API_KEY'].strip()
          for n,cid in enumerate(selected,1):
            m=byid[cid]; p=root/m['file']; data=p.read_bytes()
            with Image.open(p) as im:
              fmt=(im.format or 'JPEG').upper(); size=im.size
            mime={'JPEG':'image/jpeg','PNG':'image/png','WEBP':'image/webp'}.get(fmt,'image/jpeg')
            row={'case':f'PA10-{n:02d}','source_id':cid,'ground_truth':{'identity':m['gt'],'basis':m['basis'],'source':m['source']},'image':{'file':m['file'],'width':size[0],'height':size[1],'sha256':m['sha256']}}
            try:
              payload={'model':'gpt-5.6-sol','input':[{'role':'user','content':[{'type':'input_text','text':prompt},{'type':'input_image','image_url':f'data:{mime};base64,'+base64.b64encode(data).decode(),'detail':'high'}]}],'max_output_tokens':1400}
              r=requests.post('https://api.openai.com/v1/responses',headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'},json=payload,timeout=180); r.raise_for_status(); obj=r.json()
              text=''.join(c.get('text','') for item in obj.get('output',[]) for c in item.get('content',[]) if c.get('type')=='output_text').strip()
              if text.startswith('```json'): text=text[7:]
              elif text.startswith('```'): text=text[3:]
              if text.endswith('```'): text=text[:-3]
              row['ai_response']=json.loads(text.strip()); row['api_status']='ok'
              print(row['case'],cid,json.dumps(row['ai_response'],ensure_ascii=False))
            except Exception as e:
              row['api_status']='failed'; row['error']=str(e); print(row['case'],cid,'FAILED',e)
            rows.append(row)
          result={'model':'gpt-5.6-sol','dataset':'validated-plastic-anchor-10','ground_truth_policy':'source-established before inference; AI never changes GT','cases':rows}
          (out/'results.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          if any(x['api_status']!='ok' for x in rows): raise SystemExit('one or more inference calls failed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plastic-anchor-10-benchmark-results-v2
          path: plastic-anchor-10-results/results.json
          if-no-files-found: error
          retention-days: 14
