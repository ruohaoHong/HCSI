name: OpenAI Secret Smoke Test

on:
  push:
    paths:
      - '.github/workflows/openai-secret-smoke.yml'
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Verify secret exists
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not available to this workflow."
            exit 1
          fi
          echo "OPENAI_API_KEY is available (value not printed)."

      - name: Call OpenAI Responses API
        shell: bash
        run: |
          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" \
            https://api.openai.com/v1/responses \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d '{"model":"gpt-5.6-sol","input":"Reply with exactly: HCSI_SMOKE_OK","max_output_tokens":64}')

          echo "OpenAI HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            python - <<'PY'
          import json
          try:
              data = json.load(open('response.json'))
              err = data.get('error', {})
              print('OpenAI error type:', err.get('type', 'unknown'))
              print('OpenAI error code:', err.get('code', 'unknown'))
              print('OpenAI error message:', err.get('message', 'unknown'))
          except Exception:
              print('OpenAI returned a non-JSON error response.')
          PY
            exit 1
          fi

          python - <<'PY'
          import json
          data = json.load(open('response.json'))
          text = ''
          for item in data.get('output', []):
              for content in item.get('content', []):
                  if content.get('type') == 'output_text':
                      text += content.get('text', '')
          print('Model response:', text.strip())
          if 'HCSI_SMOKE_OK' not in text:
              raise SystemExit('API call succeeded but expected smoke-test response was not found.')
          PY
