name: 124da Underface Assist Validation
on:
  push:
    branches: ['experiment/underface-assist-from-124da']
    paths:
      - 'measurement-service/**'
      - 'benchmark/underface-assist/**'
      - 'benchmark/underface-assist/**'
      - '.github/workflows/underface-assist-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  local-regime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RULERNET_ALLOW_NONCOMMERCIAL_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r measurement-service/requirements.txt pytest
      - run: pytest -q measurement-service/tests
      - run: PYTHONPATH=measurement-service python -c "from rulernet import _load_session; _load_session(); print('RulerNet ready')"
      - name: Restore SHA-pinned B C photos from the prior accepted run
        uses: actions/download-artifact@v4
        with:
          name: thread-major-diameter-validation
          run-id: 35992509709
          github-token: ${{ github.token }}
          path: acceptance-images
      - name: Restore SHA-pinned D photo from prior accepted run
        uses: actions/download-artifact@v4
        with:
          name: real-case-d
          run-id: 36014502107
          github-token: ${{ github.token }}
          path: acceptance-images/D-reference
      - name: Recheck accepted 124da B C D and inspect optional evidence
        run: |
          set -euo pipefail
          cp acceptance-images/D-reference/D-original.jpg acceptance-images/D-original.jpg
          mkdir -p acceptance-results
          python benchmark/underface-assist/run.py --images acceptance-images --output acceptance-results/BCD.json | tee acceptance-results/BCD.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: underface-assist-124da
          path: acceptance-results/
          retention-days: 30
